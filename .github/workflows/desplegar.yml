# Entorno de desarrollo: en cada PR a developer, compilación de librerías y pruebas. Al unir a developer: lo mismo
# y, si pasa, despliegue en dev2026 con deploy/desplegar-platform.sh (shell + microfrontends en nginx, puerto 7596).
# main no despliega aquí: queda para producción.
# Corre en el runner propio instalado en dev2026 (etiqueta "dev2026"): GitHub no puede entrar a la red interna,
# el runner sale a buscar los trabajos. Se puede relanzar a mano desde Actions → "Desplegar" → Run workflow.
name: Desplegar

on:
  push:
    branches: [developer]
  # En cada PR a developer corren solo las pruebas (sin desplegar): se ve el resultado antes de unir
  pull_request:
    branches: [developer]
  workflow_dispatch:
    inputs:
      completo:
        description: "Compilar y publicar todo (si no, solo lo que cambió desde el último despliegue)"
        type: boolean
        default: false

env:
  NG_CLI_ANALYTICS: "false"

jobs:
  pruebas:
    runs-on: [self-hosted, dev2026]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # test:ci solo prueba librerías (sdk, runtime, ui): si no cambiaron libs/ ni dependencias, no hay nada nuevo
      # que probar y se ahorran npm ci + compilar librerías. A mano (Run workflow) se prueba siempre.
      - name: ¿Hace falta probar?
        id: cambios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "probar=true" >> "$GITHUB_OUTPUT"; echo "Se prueba: ejecución manual o sin commit base con el que comparar."
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(libs/|package\.json$|package-lock\.json$|angular\.json$|tsconfig[^/]*\.json$)'; then
            echo "probar=true" >> "$GITHUB_OUTPUT"; echo "Se prueba: cambiaron librerías o dependencias."
          else
            echo "probar=false" >> "$GITHUB_OUTPUT"; echo "Sin cambios en librerías ni dependencias: se omiten las pruebas."
          fi
      - if: steps.cambios.outputs.probar == 'true'
        run: npm ci --no-audit --no-fund
      # Las pruebas importan las librerías @xtein/* desde dist/ (alias de tsconfig.json)
      - if: steps.cambios.outputs.probar == 'true'
        run: npm run build:libs
      - if: steps.cambios.outputs.probar == 'true'
        run: npm run test:ci

  # Análisis estático en el SonarQube de dev2026 (http://localhost:9000 desde el runner). La edición gratuita
  # solo guarda una rama, así que se analiza al unir a developer, no en los PR. No bloquea el despliegue:
  # si falla o no están los secretos, el resto sigue igual.
  sonarqube:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/developer'
    runs-on: [self-hosted, dev2026]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarQube lo usa para saber qué código es nuevo
          fetch-depth: 0
      - name: Análisis SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "Faltan los secretos SONAR_TOKEN o SONAR_HOST_URL: se omite el análisis."; exit 0
          fi
          npx --yes @sonar/scan

  desplegar:
    needs: pruebas
    # Solo desde developer (también al relanzarlo a mano desde otra rama, no despliega)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/developer'
    # Nunca dos despliegues a la vez; uno nuevo espera a que termine el que está en curso
    concurrency:
      group: dev2026-platform
      cancel-in-progress: false
    runs-on: [self-hosted, dev2026]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar en dev2026
        # Vacío: que el runner no mate procesos al terminar el job (nginx sigue vivo)
        env:
          RUNNER_TRACKING_ID: ""
          # Solo al relanzarlo a mano con "Compilar y publicar todo"; en un push queda en false
          COMPLETO: ${{ inputs.completo == true }}
        run: bash deploy/desplegar-platform.sh "$GITHUB_SHA"
