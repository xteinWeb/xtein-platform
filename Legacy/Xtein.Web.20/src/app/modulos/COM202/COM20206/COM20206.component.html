<dx-popup width="480" [height]="'auto'" [maxHeight]="'90vh'" [showTitle]="true" title="Reprogramar fecha"
    [hideOnOutsideClick]="false" [showCloseButton]="true" [(visible)]="visiblePopup">

    <div *dxTemplate="let data of 'content'" class="repro-popup-content">

        <div class="form-field">
            <label>Nueva fecha de reprogramación</label>
            <dx-date-box type="date" displayFormat="yyyy-MM-dd" [(value)]="fechaReprogramada" [min]="fechaMinima"
                [useMaskBehavior]="true">
            </dx-date-box>
        </div>

        <div class="form-field">
            <label>Causal de reprogramación</label>
            <dx-select-box [dataSource]="configCausal.dataSource" displayExpr="VALOR1" valueExpr="VALOR1"
                [searchEnabled]="true" noDataText="Cargando datos..." [(value)]="valorCausal"
                placeholder="Seleccione una causal...">
            </dx-select-box>
        </div>

        <div class="form-field" *ngIf="itemsAgenda.length > 0">
            <label>Items a reprogramar</label>
            <dx-drop-down-box [(value)]="itemsSeleccionadosKeys" [dataSource]="itemsAgenda" valueExpr="PRODUCTO"
                displayExpr="NOMBRE_PRODUCTO" placeholder="Seleccione los items..."
                contentTemplate="itemsListTemplate">
                <div *dxTemplate="let e of 'itemsListTemplate'">
                    <dx-list [dataSource]="itemsAgenda" keyExpr="PRODUCTO" [selectionMode]="'multiple'"
                        [showSelectionControls]="true" [selectAllMode]="'allPages'"
                        [(selectedItemKeys)]="itemsSeleccionadosKeys">
                        <div *dxTemplate="let it of 'item'">
                            {{ it.PRODUCTO }} - {{ it.NOMBRE_PRODUCTO }} (Cant. pendiente: {{ it.CANTIDAD_PENDIENTE }})
                        </div>
                    </dx-list>
                </div>
            </dx-drop-down-box>
        </div>

        <div class="form-field switch-field">
            <label>Enviar email al proveedor</label>
            <dx-switch [(value)]="enviarEmail"></dx-switch>
        </div>

        <div class="form-field" *ngIf="enviarEmail">
            <label>Email(s)</label>
            <dx-tag-box placeholder="Escriba o seleccione emails..." [dataSource]="DListaEmail" displayExpr="EMAIL"
                valueExpr="EMAIL" noDataText="No se encontraron correos registrados" [acceptCustomValue]="true"
                [(value)]="emailSeleccionado" (onCustomItemCreating)="addCustomItem($event)"
                [showSelectionControls]="true" [selectAllMode]="'allPages'" [hideSelectedItems]="false"
                [searchEnabled]="true" applyValueMode="instantly">
            </dx-tag-box>
        </div>

        <div class="form-field">
            <label>Observaciones (opcional)</label>
            <dx-text-area [height]="70" [(value)]="observaciones" placeholder="Observaciones..."></dx-text-area>
        </div>

        <div class="repro-popup-actions">
            <dx-button text="Cancelar" (onClick)="cancelar()"></dx-button>
            <dx-button text="Aceptar" type="default" (onClick)="guardar()"></dx-button>
        </div>

    </div>

</dx-popup>
