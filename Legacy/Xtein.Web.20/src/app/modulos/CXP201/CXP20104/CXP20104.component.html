<!-- Sub-Menú de opciones -->
<dx-popup #popGenElec id="popGenElec" width="1000" [height]="'90%'" [showTitle]="true" [title]="titEgresos"
  [hideOnOutsideClick]="false" [showCloseButton]="true" (onShown)="onShown($event)" (onHidden)="onHidden($event)"
  (onInitialized)="onInitializedPopUp($event)" (onResizeEnd)="onResizeEnd($event)" [(visible)]="visiblePopup">

  <dxi-toolbar-item widget="dxButton" toolbar="bottom" location="after" [options]="configBotonAceptar">
  </dxi-toolbar-item>
  <dxi-toolbar-item widget="dxButton" toolbar="bottom" location="after" [options]="configBotonCancelar">
  </dxi-toolbar-item>
  <dxi-toolbar-item toolbar="bottom" location="before" text="Total pago electrónico:">
  </dxi-toolbar-item>
  <dxi-toolbar-item widget="dxTextBox" toolbar="bottom" location="before" [options]="configSeleccFacturas">
  </dxi-toolbar-item>

  <div *dxTemplate="let data of 'content'">
    <dx-load-panel #loadPanel shadingColor="rgba(0,0,0,0.4)" [position]="{ of: '#gridGenElec' }"
      [(visible)]="loadingVisible" [showIndicator]="true" [showPane]="true" [shading]="true"
      message="Cargando egresos..." [hideOnOutsideClick]="false" style="z-index: 1000000000;">
    </dx-load-panel>

    <dx-data-grid #gridGenElec id="gridGenElec" class="xt-datagrid" height="78%" noDataText=""
      [dataSource]="DPreEgresos" keyExpr="EGRESO" [selection]="{ mode: 'multiple', showCheckBoxesMode: 'always' }"
      [selectedRowKeys]="seleccPreEgresos" [allowColumnResizing]="true" columnResizingMode="nextColumn"
      [showBorders]="true" [focusedRowEnabled]="true" (onCellPrepared)="onCellPrepared($event)"
      (onEditingStart)="onEditingStart($event)" (onSelectionChanged)="onSelectionFact($event)" [wordWrapEnabled]="true">
      <dxo-header-filter [visible]="true" [allowSearch]="true"></dxo-header-filter>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-grouping [autoExpandAll]="false"></dxo-grouping>
      <dxo-group-panel [visible]="true" placeholder="Arrastre un encabezado aquí para agrupar"></dxo-group-panel>

      <dxi-column dataField="EGRESO" caption="Egreso" [allowEditing]="false">
      </dxi-column>
      <dxi-column dataField="FECHA" caption="Fecha" [allowEditing]="false">
      </dxi-column>
      <dxi-column dataField="ID_PROVEEDOR" caption="ID Proveedor" [allowEditing]="false" [groupIndex]="0">
      </dxi-column>
      <dxi-column dataField="NOMBRE_PROVEEDOR" caption="Nombre Proveedor" [allowEditing]="false">
      </dxi-column>
      <dxi-column dataField="TOTAL" caption="Total" alignment="right" dataType="number" format="#,###.00"
        [allowEditing]="false">
      </dxi-column>
      <dxi-column dataField="EMAILS" caption="Correos" [allowEditing]="false" cellTemplate="emailTemplate" [width]="120"
        alignment="center">
      </dxi-column>

      <div *dxTemplate="let cellInfo of 'emailTemplate'">
        <dx-button icon="email" [text]="getParsedEmails(cellInfo.data.EMAILS).length.toString()"
          hint="Gestionar correos" (onClick)="abrirModalEmails(cellInfo.data)">
        </dx-button>
      </div>

    </dx-data-grid>

  </div>

</dx-popup>

<!-- Modal para Gestión de Correos -->
<dx-popup #popEmails [width]="500" [height]="'auto'" [showTitle]="true" title="Gestionar Correos Electrónicos"
  [dragEnabled]="true" [hideOnOutsideClick]="true" [(visible)]="visiblePopEmails">

  <div *dxTemplate="let data of 'content'">
    <div class="p-3">
      <p *ngIf="rowActualEdicion">Proveedor: <b>{{ rowActualEdicion.NOMBRE_PROVEEDOR }}</b></p>

      <div class="email-list-container mt-2">
        <div *ngIf="listaEmailsEdicion.length === 0" class="text-center p-3 text-muted">
          No hay correos asociados.
        </div>
        <div *ngFor="let email of listaEmailsEdicion; let i = index" class="email-item">
          <span class="email-text">{{ email }}</span>
          <dx-button icon="trash" type="danger" stylingMode="text" (onClick)="quitarEmailModal(i)">
          </dx-button>
        </div>
      </div>

      <div class="add-email-container">
        <dx-text-box [(value)]="nuevoEmailModal" placeholder="Nuevo correo electrónico..." mode="email"
          style="flex-grow: 1;">
        </dx-text-box>
        <dx-button icon="add" text="Añadir" type="default" (onClick)="agregarEmailModal()">
        </dx-button>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <dx-button text="Cancelar" (onClick)="visiblePopEmails = false">
        </dx-button>
        <dx-button text="Guardar Cambios" type="success" (onClick)="guardarEmailsModal()">
        </dx-button>
      </div>
    </div>
  </div>
</dx-popup>
