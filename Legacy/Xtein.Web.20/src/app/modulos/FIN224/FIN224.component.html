<div class="row gx-3">
  <div class="col-12">
    <div class="card-content">
      <div>
        <dx-form
          #formCondiciones
          id="formCondiciones"
          [formData]="FCondiciones"
          [readOnly]="readOnlyForm"
          [colCount]="2"
          labelLocation="left"
        >
          <dxi-item caption="" itemType="group">
            <dxi-item
              dataField="ID_CONDICION"
              [editorOptions]="{ readOnly: readOnly }"
            >
              <dxo-label text="Código"></dxo-label>

              <dxi-validation-rule
                type="async"
                message="Esta condición ya existe!"
                [validationCallback]="ValideExistenciaCondicion"
              >
              </dxi-validation-rule>
              <dxi-validation-rule
                type="required"
                message="Código es requerido"
              >
              </dxi-validation-rule>
            </dxi-item>

            <dxi-item
              dataField="DESCRIPCION"
              [editorOptions]="{ readOnly: readOnly }"
            >
              <dxo-label text="Descripción"></dxo-label>

              <dxi-validation-rule
                type="required"
                message="Descripción es requerida"
              >
              </dxi-validation-rule>
            </dxi-item>

            <dxi-item editorType="dxSelectBox">
              <dxo-label text="Tipo"></dxo-label>
              <div *dxTemplate>
                <dx-select-box
                  #dxEstado
                  id="dxTIPO"
                  [dataSource]="['VENTAS', 'PROVEEDOR']"
                  [readOnly]="readOnly"
                  [(value)]="FCondiciones.TIPO"
                  (onValueChanged)="onSeleccTipo($event)"
                >
                </dx-select-box>
              </div>
            </dxi-item>
            <!-- <dxi-item dataField="DESCUENTOS" [style.border]="borderStyle">
              <dxo-label text="Descuentos"></dxo-label>
              <app-xc-selectbox #xs_DESCUENTOS id="xs_DESCUENTOS" nombreObj="DESCUENTOS" [readOnly]="readOnly"
                [valorDefecto]="FCondiciones.DESCUENTOS" [customValue]="customValueSboxDESCUENTOS"
                [events]="eventsSubjectSboxDESCUENTOS.asObservable()" (onRespuestaSelecc)="onSeleccDESCUENTOS($event)">
              </app-xc-selectbox>
            </dxi-item> -->
          </dxi-item>

          <dxi-item caption="" itemType="group">
            <dxi-item editorType="dxSelectBox">
              <dxo-label text="Estado"></dxo-label>
              <div *dxTemplate>
                <dx-select-box
                  #dxEstado
                  id="dxEstado"
                  [dataSource]="['ACTIVO', 'INACTIVO']"
                  [readOnly]="readOnly"
                  [(value)]="FCondiciones.ESTADO"
                  (onValueChanged)="onSeleccEstado($event)"
                >
                </dx-select-box>
              </div>
            </dxi-item>
            <dxi-item editorType="dxSelectBox">
              <dxo-label text="Plan de Financiación"></dxo-label>
              <div *dxTemplate>
                <dx-select-box
                  #dxEstado
                  id="dxPLAN_FINANCIERO"
                  [dataSource]="DLPlanes"
                  [readOnly]="readOnly"
                  displayExpr="PLAN_FIN"
                  valueExpr="ID_PLAN"
                  [(value)]="FCondiciones.ID_PLAN"
                  (onValueChanged)="onSeleccPLAN_FINANCIERO($event)"
                >
                </dx-select-box>
              </div>
            </dxi-item>
          </dxi-item>
        </dx-form>
      </div>
      <br />
    </div>
  </div>

  <div class="row gx-3">
    <div class="col-12">
      <div class="card-content card-table" id="FIN224" #FIN224>
        <div class="container-child-dos-app xt-gesptabs">
          <dx-data-grid
            #gridcondiciones
            id="gridcondiciones"
            [columnAutoWidth]="true"
            [dataSource]="Itm_Condiciones"
            [allowColumnResizing]="true"
            [columnAutoWidth]="true"
            columnResizingMode="nextColumn"
            [focusedRowEnabled]="true"
            [rowAlternationEnabled]="true"
            [hoverStateEnabled]="true"
            keyExpr="ID_LISTA"
            noDataText=""
            [showBorders]="true"
            (onContentReady)="onContentReady($event)"
            (onRowValidating)="onRowValidating($event)"
            (onInitNewRow)="onInitNewRowPro($event)"
            (onSelectionChanged)="selectionGrid($event)"
            (onCellPrepared)="onCellPrepared($event)"
            (onEditingStart)="onEditingStart($event)"
            (onEditingStart)="startEdit($event)"
          >
            <dxo-editing
              mode="row"
              [useIcons]="false"
              [allowUpdating]="!readOnly"
              [allowDeleting]="false"
              [allowAdding]="!readOnly"
            >
              <dxo-texts confirmDeleteMessage=""> </dxo-texts>
            </dxo-editing>
            <dxo-scrolling mode="virtual"></dxo-scrolling>
            <dxo-selection
              selectAllMode="allPages"
              [showCheckBoxesMode]="esVisibleSelecc"
              mode="multiple"
            >
            </dxo-selection>

            <dxi-column
              dataField="ID_LISTA"
              caption="Lista"
              editCellTemplate="editLista"
            >
            </dxi-column>

            <dxi-column
              dataField="DESCRIPCION"
              caption="Descripción"
              editCellTemplate="editDescripcion"
            >
            </dxi-column>

            <!-- <dxi-column dataField="OPCIONES" caption="Opciones" editCellTemplate="editOpciones">
            </dxi-column> -->

            <!-- TEMPLATE -->
            <div *dxTemplate="let cellInfo of 'editLista'">
              <dx-select-box
                #dxEstado
                id="dxPLAN_FINANCIERO"
                displayExpr="ID_LISTA"
                valueExpr="ID_LISTA"
                [dataSource]="DLPreciosFiltrados"
                [(value)]="cellInfo.data.ID_LISTA"
                (onValueChanged)="onValueChangedGridLista($event, cellInfo)"
                placeholder="Seleccione una lista"
              >
              </dx-select-box>
            </div>

            <div *dxTemplate="let cellInfo of 'editDescripcion'">
              <dx-text-box
                placeholder="Descripción"
                [value]="cellInfo.data.DESCRIPCION"
                [readOnly]="true"
              >
              </dx-text-box>
            </div>

            <!-- <div *dxTemplate="let cellInfo of 'editOpciones'">
              <dx-text-box placeholder="Opciones" [value]="cellInfo.data.OPCIONES"
                (onValueChanged)="onValueChangedGridOpciones($event, cellInfo)">
              </dx-text-box>
            </div> -->

            <dxo-toolbar *ngIf="!readOnly">
              <dxi-item location="before">
                <div *dxTemplate>
                  <dx-button
                    icon="plus"
                    matTooltip="Nuevo"
                    (onClick)="operGrid($event, 'new')"
                    *ngIf="rowNew"
                  >
                  </dx-button>
                </div>
              </dxi-item>
              <dxi-item location="before">
                <div *dxTemplate>
                  <dx-button
                    icon="edit"
                    matTooltip="Actualizar"
                    (onClick)="operGrid($event, 'edit')"
                    *ngIf="rowEdit"
                  >
                  </dx-button>
                </div>
              </dxi-item>
              <dxi-item location="before">
                <div *dxTemplate>
                  <dx-button
                    icon="trash"
                    matTooltip="Eliminar"
                    (onClick)="operGrid($event, 'delete')"
                    *ngIf="rowDelete"
                  >
                  </dx-button>
                </div>
              </dxi-item>
              <dxi-item location="before">
                <div *dxTemplate>
                  <dx-button
                    icon="todo"
                    matTooltip="Guardar"
                    (onClick)="operGrid($event, 'save')"
                    *ngIf="rowApplyChanges"
                  >
                  </dx-button>
                </div>
              </dxi-item>
              <dxi-item location="before">
                <div *dxTemplate>
                  <dx-button
                    icon="undo"
                    matTooltip="Cancelar"
                    (onClick)="operGrid($event, 'cancel')"
                    *ngIf="rowApplyChanges"
                  >
                  </dx-button>
                </div>
              </dxi-item>
            </dxo-toolbar>
          </dx-data-grid>
        </div>
      </div>
    </div>
  </div>
</div>

<dx-load-panel
  #loaderPanel
  shadingColor="rgba(0,0,0,0.4)"
  [position]="{ of: '#router-container' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  message="Un momento. Cargando datos..."
  [hideOnOutsideClick]="false"
></dx-load-panel>

<app-filtrobusq
  [events]="eventsSubjectFiltro.asObservable()"
  (onRespuestaSelecc)="onRespuestaFiltro($event)"
>
</app-filtrobusq>

<app-vistarapida
  id="vistafin224"
  [aplicacion]="prmUsrAplBarReg.aplicacion"
></app-vistarapida>

<app-geninformes [events]="eventsSubjectInformes.asObservable()">
</app-geninformes>
