<div class="container">
  <h2>Gestión de Empleados</h2>
  
  <dx-data-grid
    [dataSource]="empleados"
    [showBorders]="true"
    [showRowLines]="true"
    [showColumnLines]="true"
    [rowAlternationEnabled]="true"
    [hoverStateEnabled]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    keyExpr="ID_EMPLEADO"
    (onRowInserting)="onRowInserting($event)"
    (onRowUpdating)="onRowUpdating($event)"
    (onRowRemoving)="onRowRemoving($event)"
    (onEditorPreparing)="onEditorPreparing($event)">

    <!-- Configuración de edición -->
    <dxo-editing
      mode="cell"
      [allowAdding]="true"
      [allowUpdating]="true"
      [allowDeleting]="true"
      [useIcons]="true">
      <!-- <dxo-popup
        title="Información del Empleado"
        [showTitle]="true"
        [width]="700"
        [height]="450">
      </dxo-popup>
      <dxo-form>
        <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
          <dxi-item dataField="ID_EMPLEADO"></dxi-item>
          <dxi-item dataField="NOMBRE"></dxi-item>
          <dxi-item dataField="EMPRESA"></dxi-item>
          <dxi-item dataField="FECHA"></dxi-item>
          <dxi-item dataField="SALARIO"></dxi-item>
          <dxi-item dataField="VALOR"></dxi-item>
        </dxi-item>
      </dxo-form> -->
    </dxo-editing>

    <!-- Configuración de filtros -->
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-search-panel [visible]="true" [width]="240" placeholder="Buscar..."></dxo-search-panel>

    <!-- Configuración de paginación -->
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[5, 10, 20, 50]"
      [showInfo]="true">
    </dxo-pager>

    <!-- Configuración de columnas -->
    <dxi-column
      dataField="ID_EMPLEADO"
      caption="ID Empleado"
      [allowEditing]="false"
      [width]="150"
      [allowEditing]="true">
      <dxi-validation-rule type="required" message="El ID es requerido"></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="NOMBRE"
      caption="Nombre Completo"
      [allowEditing]="false"
      [width]="200">
      <dxi-validation-rule type="required" message="El nombre es requerido"></dxi-validation-rule>
      <dxi-validation-rule type="stringLength" [min]="3" message="El nombre debe tener al menos 3 caracteres"></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="EMPRESA"
      caption="Empresa"
      [allowEditing]="false"
      [width]="180">
      <dxi-validation-rule type="required" message="La empresa es requerida"></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="FECHA"
      caption="Fecha"
      dataType="date"
      format="dd/MM/yyyy"
      [allowEditing]="false"
      [width]="120">
      <dxi-validation-rule type="required" message="La fecha es requerida"></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="SALARIO"
      caption="Salario"
      dataType="number"
      format="#,##0"
      [width]="140">
      <dxi-validation-rule type="required" message="El salario es requerido"></dxi-validation-rule>
      <dxi-validation-rule type="range" [min]="0" message="El salario debe ser mayor a 0"></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="VALOR"
      caption="Valor"
      dataType="number"
      format="#,##0"
      [width]="140">
      <dxi-validation-rule type="required" message="El valor es requerido"></dxi-validation-rule>
      <dxi-validation-rule type="range" [min]="0" message="El valor debe ser mayor a 0"></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      caption="">
    </dxi-column>

    <!-- Resumen -->
    <dxo-summary>
      <dxi-total-item
        column="SALARIO"
        summaryType="sum"
        displayFormat="Total: {0}">
      </dxi-total-item>
      <dxi-total-item
        column="VALOR"
        summaryType="sum"
        displayFormat="Total: {0}">
      </dxi-total-item>
    </dxo-summary>

    <!-- Exportación -->
    <dxo-export [enabled]="true" [allowExportSelectedData]="true"></dxo-export>

    <!-- Selección de filas -->
    <dxo-selection mode="single"></dxo-selection>

  </dx-data-grid>
</div>
