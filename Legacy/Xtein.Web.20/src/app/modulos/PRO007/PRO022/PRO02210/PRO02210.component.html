<dx-data-grid
    #gridUnidadesMedida
    id="gridUnidadesMedida"
    noDataText="" 
    [dataSource]="DUnidadesMedida"
    keyExpr="ITEM"
    [allowColumnResizing]="true"
    columnResizingMode="nextColumn"
    [showBorders]="true"
    [focusedRowEnabled]="true"
    width="100%"
    (onInitNewRow)="onInitNewRow($event)"
    (onRowInserting)="insertingRow($event)"
    (onRowInserted)="insertedRow($event)"
    (onRowUpdating)="updatingRow($event)"
    (onRowUpdated)="updatedRow($event)"
    (onRowRemoved)="removedRow($event)"
    (onEditingStart)="onEditingStart($event)"
    (onRowPrepared)="onRowPrepared($event)"
    (onRowValidating)="onRowValidating($event)"
    (onSelectionChanged)="selectionGrid($event)"
    >

    <dxo-editing 
        mode="cell"
        [useIcons]="false" 
        [allowUpdating]="esEdicion" 
        [allowDeleting]="false" 
        [allowAdding]="esEdicion">
        <dxo-texts
            confirmDeleteMessage="">
        </dxo-texts>
    </dxo-editing>

    <dxo-selection 
        selectAllMode="allPages"     
        [showCheckBoxesMode]="esVisibleSelecc" 
        mode="multiple">
    </dxo-selection>

    <dxi-column dataField="ITEM" [visible]="false"></dxi-column>
    <dxi-column 
        dataField="UDM_COMPRA" 
        caption="UM Pres" 
        calculateDisplayValue="UDM_COMPRA"
        editCellTemplate="listaUMCompra" 
        >
    </dxi-column>
    <dxi-column dataField="DESC_COMPRA" caption="Nombre UM" [allowEditing]="false">
    </dxi-column>
    <dxi-column 
      dataField="CAN_PRESENTACION" 
      alignment="right" 
      caption="Cant. Pres" 
      calculateDisplayValue="CAN_PRESENTACION" 
      dataType="number" 
      format="#,##0.00" 
      >
    </dxi-column>
    <dxi-column 
        dataField="UDM_EQUIV" 
        caption="UM Equivalencia" 
        calculateDisplayValue="UDM_EQUIV"
        editCellTemplate="listaUMEquiv" 
        >
    </dxi-column>
    <dxi-column dataField="DESC_EQUIV" caption="Nombre UM" [allowEditing]="false">
    </dxi-column>
    <dxi-column 
      dataField="CAN_EQUIV" 
      alignment="right" 
      caption="Cant. Equiv" 
      calculateDisplayValue="CAN_EQUIV" 
      dataType="number" 
      format="#,##0.00" 
      >
    </dxi-column>
    <dxi-column 
        dataField="CODIGO_BARRAS" 
        calculateDisplayValue="CODIGO_BARRAS" 
        caption="Codigo Barras"
        [setCellValue]="onChangeCBarras"
        >
    </dxi-column>
    <dxi-column dataField="CODIGO_ASOCIADO" caption="Codigo asociado" >
    </dxi-column>
    <dxi-column 
        dataField="ESTADO" 
        caption="Estado" 
        editCellTemplate="listaEstado" 
        [setCellValue]="setEstado">
    </dxi-column>
    <dxi-column dataField="DETALLE" caption="Detalle" >
    </dxi-column>

    <div *dxTemplate="let cellInfo of 'listaUMCompra'">
        <dx-select-box 
            #xs_UDM_COMPRA
            id="xs_UDM_COMPRA"
            [dataSource]="DListaUM" 
            [searchEnabled]="true"
            [(value)]="cellInfo.data.UDM_COMPRA"
            displayExpr="ID_UDM"
            valueExpr="ID_UDM"
            searchMode="contains"
            [dropDownOptions]="{ width: 600 }"
            (onValueChanged)="onValueChangedUMCompra($event, cellInfo)"
            >
            <div *dxTemplate="let data of 'item'">
            <div style="width: 40%; float:left">
                {{ data.ID_UDM }}
            </div>
            
            <div style="width: 60%; float:right; ">
                {{ data.NOMBRE }}
            </div>
            </div>

        </dx-select-box>
    </div>

    <div *dxTemplate="let cellInfo of 'listaUMEquiv'">
        <dx-select-box 
            #xs_UDM_EQUIV
            id="xs_UDM_EQUIV"
            [dataSource]="DListaUM" 
            [(value)]="cellInfo.data.UDM_EQUIV"
            [searchEnabled]="true"
            displayExpr="ID_UDM"
            valueExpr="ID_UDM"
            searchMode="contains"
            [dropDownOptions]="{ width: 600 }"
            (onValueChanged)="onValueChangedUMEquiv($event, cellInfo)"
            >
            <div *dxTemplate="let data of 'item'">
            <div style="width: 40%; float:left">
                {{ data.ID_UDM }}
            </div>
            
            <div style="width: 60%; float:right; ">
                {{ data.NOMBRE }}
            </div>
            </div>

        </dx-select-box>
    </div>

    <div *dxTemplate="let cellInfo of 'listaEstado'">
        <dx-select-box
            #dxEstado
            id="dxEstado"
            [dataSource]="['ACTIVO','INACTIVO']"
            [readOnly]="true"
            [(value)]="cellInfo.data.ESTADO"
        >
        </dx-select-box>
    </div>


    <dxo-toolbar *ngIf="esEdicion">
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="plus" matTooltip="Nuevo" (onClick)="operGrid($event,'new')" *ngIf="rowNew">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="edit" matTooltip="Actualizar" (onClick)="operGrid($event,'update')" *ngIf="rowEdit">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="trash" matTooltip="Eliminar" (onClick)="operGrid($event,'delete')" *ngIf="rowDelete">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="todo" matTooltip="Guardar" (onClick)="operGrid($event,'save')" *ngIf="rowApplyChanges">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="undo" matTooltip="Cancelar" (onClick)="operGrid($event,'cancel')" *ngIf="rowApplyChanges">
            </dx-button>
            </div>
        </dxi-item>
    </dxo-toolbar>
    
</dx-data-grid>
