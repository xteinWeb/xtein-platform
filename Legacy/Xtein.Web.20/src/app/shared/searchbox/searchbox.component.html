<div class="search-container">
  <div class="search-input-wrapper">
    <input 
      #searchInputElement
      type="text"
      class="search-input w-100"
      [formControl]="searchControl"
      placeholder="Buscar..."
      (blur)="onBlur()"
      (focus)="onFocus()">
    <!-- <span *ngIf="isLoading" class="spinner"></span> -->
    <div class="input-icons">
      <button *ngIf="hasText" 
              type="button" 
              class="clear-button" 
              (click)="clearSearch()" 
              title="Clear search">
          <span class="clear-icon">×</span>
      </button>
      <span *ngIf="isLoading" class="spinner"></span>
    </div>

  </div>
  
  <!-- <div class="dropdown-container" *ngIf="showDropdown" [style.width.px]="inputWidth">
    <div *ngIf="results.length === 0" class="no-results">
      No results found
    </div>
    <ul *ngIf="results.length > 0" class="results-list">
      <li *ngFor="let item of results" 
          (click)="selectItem(item)" 
          class="result-item">
        {{ item.name }}
      </li>
    </ul>
  </div> -->

  <div class="dropdown-container" *ngIf="showDropdown" [style.width.px]="inputWidth" (wheel)="onMouseWheel($event)">
    <div *ngIf="results.length === 0" class="no-results">
      No se encontraron datos
    </div>
    
    <div id="sticky">
      <dx-button
        id="btnSeleccion"  
        #btnSeleccion
        stylingMode="contained"
        text="Seleccionar"
        type="default"
        [width]="170"
        (onClick)="clickSelecc($event)"
      >
      </dx-button>
    </div>

    <table *ngIf="results.length > 0" class="results-table">
      <thead>
        <tr>
          <th>
            <input type="checkbox" class="fila-checkbox" (change)="toggleSelectAll($event)">
          </th>
          <th *ngFor="let item of columnas">{{ item }}</th>
          <!-- <th class="id-column">Id</th> -->
          <!-- <th class="name-column">Name</th> -->
        </tr>
      </thead>
      <tbody>
        <!-- (click)="selectItem(item)"  -->
        <tr *ngFor="let item of results" 
            class="result-row">
          <!-- <td class="id-column">{{ item.id }}</td>
          <td class="name-column">{{ item.name }}</td> -->
          <td>
            <input type="checkbox" class="fila-checkbox" 
                  [checked]="isSelected(item)"
                  (change)="toggleSeleccion(item)">
          </td>
          <td *ngFor="let col of columnas">{{ item[col] }}</td>
        </tr>
      </tbody>
    </table>

  </div>
    
</div>
