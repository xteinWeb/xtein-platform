<div class="row gx-3">
    <div class="col-12">

      <div class="card-content row">

        <dx-form
          [(formData)]="DAplicaciones"
          [readOnly]="readOnly"
          [colCount]="2"
          labelLocation="top"
          [showColonAfterLabel]="false"
        >
          <!-- Grupo Principal -->
          <dxi-item itemType="group" caption="Información General" [colSpan]="1" [colCount]="2">

            <!-- ID Aplicación -->
            <dxi-item
              dataField="ID_APLICACION"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 30,
                placeholder: 'Ingrese ID de aplicación',
              }"
            >
              <dxi-validation-rule
                type="async"
                message="Esta aplicación ya existe!"
                [validationCallback]="ValideExistencia">
              </dxi-validation-rule>
              <dxi-validation-rule type="required" message="ID de aplicación es requerido"></dxi-validation-rule>
              <dxo-label text="ID Aplicación"></dxo-label>
            </dxi-item>

            <!-- ID Aplicación Padre -->
            <dxi-item
              dataField="ID_APLICACION_PADRE"
              editorType="dxSelectBox"
              [editorOptions]="{
                items: idAppPadreItems,
                placeholder: 'Seleccione tipo',
                searchEnabled: true
              }"
            >
              <dxo-label text="ID Aplicación Padre"></dxo-label>
              <div *dxTemplate>
                <dx-select-box
                  [dataSource]="idAppPadreItems"
                  [(value)]="DAplicaciones.ID_APLICACION_PADRE"
                  [readOnly]="readOnly"
                  displayExpr="APLICACION"
                  valueExpr="ID_APLICACION"
                  [searchEnabled]="true"
                  placeholder="Seleccione ID Aplicación Padre"
                  (onValueChanged)="onValueChanged($event)"
                >
                </dx-select-box>
              </div>
            </dxi-item>

            <!-- Nombre -->
            <dxi-item
              dataField="NOMBRE"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 60,
                placeholder: 'Ingrese nombre de aplicación'
              }"
              [colSpan]="1"
            >
              <dxi-validation-rule type="required" message="Nombre es requerido"></dxi-validation-rule>
              <dxo-label text="Nombre"></dxo-label>
            </dxi-item>

            <!-- Tipo -->
            <dxi-item
              dataField="TIPO"
              editorType="dxSelectBox"
              [editorOptions]="{
                items: tipoItems,
                placeholder: 'Seleccione tipo',
                searchEnabled: true
              }"
            >
              <dxi-validation-rule type="required" message="Tipo es requerido"></dxi-validation-rule>
              <dxo-label text="Tipo"></dxo-label>
            </dxi-item>

            <!-- Genera -->
            <dxi-item
              dataField="GENERA_CONTABILIDAD"
              editorType="dxCheckBox"
              [editorOptions]="{
                text: 'Genera Contabilidad'
              }"
            >
              <dxo-label text="Genera Contabilidad"></dxo-label>
            </dxi-item>

            <!-- Estado -->
            <dxi-item
              dataField="ESTADO"
              editorType="dxSelectBox"
              [editorOptions]="{
                items: estadoItems,
                placeholder: 'Seleccione estado',
                searchEnabled: true
              }"
            >
              <dxo-label text="Estado"></dxo-label>
            </dxi-item>

          </dxi-item>

          <dxi-item itemType="group" caption="Adicionales" [colSpan]="1" [colCount]="2">
            <!-- Programa -->
            <dxi-item
              dataField="NOMBRE_PROGRAMA"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 50,
                placeholder: 'Ingrese programa'
              }"
            >
              <dxo-label text="Programa"></dxo-label>
            </dxi-item>

            <!-- Tabla Aplicación -->
            <dxi-item
              dataField="TABLA_APLICACION"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 50,
                placeholder: 'Ingrese tabla aplicación'
              }"
            >
              <dxo-label text="Tabla Aplicación"></dxo-label>
            </dxi-item>

            <!-- Directorio -->
            <dxi-item
              dataField="DIRECTORIO"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 200,
                placeholder: 'Ingrese directorio'
              }"
              [colSpan]="1"
            >
              <dxo-label text="Directorio"></dxo-label>
            </dxi-item>

            <!-- Parámetros -->
            <dxi-item
              dataField="PARAMETROS"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 50,
                placeholder: 'Ingrese parámetros'
              }"
            >
              <dxo-label text="Parámetros"></dxo-label>
            </dxi-item>

            <!-- Tipo Sistema -->
            <dxi-item
              dataField="TIPO_SISTEMA"
              editorType="dxSelectBox"
              [editorOptions]="{
                items: tipoSistemaItems,
                placeholder: 'Seleccione tipo de sistema',
                searchEnabled: true
              }"
            >
              <dxo-label text="Tipo Sistema"></dxo-label>
            </dxi-item>

            <!-- Fecha Vigencia -->
            <dxi-item
              dataField="FECHA_VIGENCIA"
              editorType="dxDateBox"
              [editorOptions]="{
                type: 'datetime',
                displayFormat: 'dd/MM/yyyy HH:mm',
                placeholder: 'Seleccione fecha'
              }"
            >
              <dxo-label text="Fecha Vigencia"></dxo-label>
            </dxi-item>

          </dxi-item>

          <!-- Grupo de URLs e Imágenes -->
          <dxi-item itemType="group" caption="Recursos e Imágenes" [colSpan]="2">

            <!-- Imagen URL -->
            <dxi-item
              dataField="URL_IMAGEN"
              editorType="dxTextBox"
              [editorOptions]="{
                maxLength: 200,
                placeholder: 'Ingrese URL de imagen'
              }"
              [colSpan]="2"
            >
              <dxo-label text="URL Imagen"></dxo-label>
            </dxi-item>

            <!-- Imagen -->
            <!-- <dxi-item
              dataField="IMAGEN"
              editorType="dxFileUploader"
              [editorOptions]="{
                selectButtonText: 'Seleccionar imagen',
                labelText: 'Arrastre una imagen aquí',
                accept: 'image/*',
                uploadMode: 'useForm'
              }"
            >
              <dxo-label text="Imagen"></dxo-label>
            </dxi-item> -->

            <!-- Imagen 24 -->
            <!-- <dxi-item
              dataField="IMAGEN_TAMANO"
              editorType="dxFileUploader"
              [editorOptions]="{
                selectButtonText: 'Seleccionar imagen 24x24',
                labelText: 'Arrastre una imagen aquí',
                accept: 'image/*',
                uploadMode: 'useForm'
              }"
            >
              <dxo-label text="Imagen 24x24"></dxo-label>
            </dxi-item> -->

            <!-- Imagen Aplicación -->
            <!-- <dxi-item
              dataField="IMAGEN_APLICACION"
              editorType="dxFileUploader"
              [editorOptions]="{
                selectButtonText: 'Seleccionar imagen aplicación',
                labelText: 'Arrastre una imagen aquí',
                accept: 'image/*',
                uploadMode: 'useForm'
              }"
              [colSpan]="2"
            >
              <dxo-label text="Imagen Aplicación"></dxo-label>
            </dxi-item> -->

          </dxi-item>

          <!-- Grupo de Comentarios -->
          <dxi-item itemType="group" caption="Comentarios" [colSpan]="2">

            <!-- Comentarios -->
            <dxi-item
              dataField="COMENTARIOS"
              editorType="dxTextArea"
              [editorOptions]="{
                height: 120,
                placeholder: 'Ingrese comentarios'
              }"
              [colSpan]="2"
            >
              <dxo-label text="Comentarios"></dxo-label>
            </dxi-item>

          </dxi-item>

          <!-- Botones de Acción -->
          <!-- <dxi-item itemType="group" [colSpan]="2" [colCount]="2" cssClass="buttons-right">
            <dxi-item itemType="button">
              <dxo-button-options
                text="Guardar"
                type="success"
                icon="save"
                (onClick)="onSave()"
              ></dxo-button-options>
            </dxi-item>

            <dxi-item itemType="button">
              <dxo-button-options
                text="Cancelar"
                type="normal"
                icon="close"
                (onClick)="onCancel()"
              ></dxo-button-options>
            </dxi-item>
          </dxi-item> -->

        </dx-form>

        </div>
      </div>
    </div>

  <app-vistarapida
    id="vistaadm201"
    [aplicacion]="prmUsrAplBarReg.aplicacion"
  ></app-vistarapida>

<app-geninformes [events]="eventsSubjectInformes.asObservable()">
</app-geninformes>
