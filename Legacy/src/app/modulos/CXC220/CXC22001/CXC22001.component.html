<div class="solicitud-credito-container">

    <dx-data-grid
        #gridConsultaSol
        id="gridConsultaSol"
        [dataSource]="DSolicitudCredito"
        [showBorders]="true"
        [remoteOperations]="{ paging: true, sorting: false, filtering: true }"
        [paging]="{ pageSize: pageSize }"
        [pager]="{ showPageSizeSelector: true, allowedPageSizes: [10,50,100], showInfo: true }"
        keyExpr="DOCUMENTO"
        [rowAlternationEnabled]="true"
        >

    <!-- Search Panel -->
    <dxo-search-panel 
        [visible]="true" 
        [highlightCaseSensitive]="false"
        [width]="500"
        >
    </dxo-search-panel>

    <dxo-paging [enabled]="true"></dxo-paging>

    <!-- Filtro por columnas -->
    <dxo-filter-row 
        [visible]="true" 
        applyFilter="auto">
    </dxo-filter-row>

    <!-- Columnas -->
    <dxi-column 
        dataField="DOCUMENTO" 
        caption="Documento"
        cellTemplate="documentoTemplate">
    </dxi-column>

    <dxi-column 
        dataField="FECHA" 
        caption="Fecha" 
        dataType="date" 
        format="yyyy-MM-dd">
    </dxi-column>

    <dxi-column 
        dataField="ID_CLIENTE" 
        caption="Código Cliente">
    </dxi-column>

    <dxi-column 
        dataField="NOMBRE" 
        caption="Nombre Cliente">
    </dxi-column>

    <dxi-column 
        dataField="ESTADO" 
        caption="Estado">
    </dxi-column>

    <!-- Template para DOCUMENTO como hyperlink -->
    <div *dxTemplate="let cellInfo of 'documentoTemplate'">
        <a href="#" (click)="abrirDocumento(cellInfo.data.DOCUMENTO)">
        {{ cellInfo.data.DOCUMENTO }}
        </a>
    </div>

    </dx-data-grid>

</div>

<!-- Loading Panel -->
<dx-load-panel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ of: '#gridConsultaSol' }"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
    [visible]="loadingVisible"
    shadingColor="rgba(0,0,0,0.4)"
    message="Cargando...">
</dx-load-panel>
