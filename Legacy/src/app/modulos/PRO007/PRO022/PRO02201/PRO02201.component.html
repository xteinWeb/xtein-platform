<div *ngIf="clase===1">
    <dx-data-grid
        #gridAtributos
        id="gridAtributos"
        class="xt-datagrid"
        [dataSource]="DAtributos"
        keyExpr="ITEM"
        [allowColumnResizing]="true"
        columnResizingMode="nextColumn"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [focusedRowEnabled]="true"
        (onInitNewRow)="onInitNewRow($event, 'grid')"
        (onRowInserting)="insertingRow($event, 'grid')"
        (onRowInserted)="insertedRow($event, 'grid')"
        (onRowUpdated)="updatedRow($event, 'grid')"
        (onRowRemoved)="removedRow($event, 'grid')"
        (onEditingStart)="onEditingStart($event, 'grid')"
        (onRowPrepared)="onRowPrepared($event, 'grid')"
        (onRowValidating)="onRowValidating($event, 'grid')"
        (onSelectionChanged)="selectionGrid($event, 'grid')"
        (onCellPrepared)="onCellPrepared($event, 'grid')"
    >

        <dxo-editing 
            mode="cell"
            [useIcons]="false" 
            [allowUpdating]="esEdicion" 
            [allowDeleting]="false" 
            [allowAdding]="esEdicion">
            <dxo-texts
                confirmDeleteMessage="">
            </dxo-texts>
        </dxo-editing>

        <dxo-selection 
            selectAllMode="allPages"
            [showCheckBoxesMode]="esVisibleSelecc" 
            mode="multiple">
        </dxo-selection>

        <dxi-column dataField="CODIGO" 
                    caption="Atributo" 
                    [setCellValue]="onSeleccAtributo"
                    cellTemplate="tempAtributo"
                    calculateDisplayValue="CODIGO">
            <dxo-lookup
                [dataSource]="DListaAtributos"
                displayExpr="CODIGO_NOMBRE"
                valueExpr="CODIGO"
                placeholder="Atributo"
            >
            </dxo-lookup>
    
        </dxi-column>
        <dxi-column dataField="VALOR" 
                    caption="Valor"
                    [setCellValue]="onSeleccValAtr"
                    cellTemplate="tempValorAtributo"
                    calculateDisplayValue="VALOR">
            <dxo-lookup
                [dataSource]="DListaValAtr"
                displayExpr="ATRIBUTO"
                valueExpr="ATRIBUTO"
            >
            </dxo-lookup>
        </dxi-column>
        <dxi-column dataField="DETALLE" caption="Detalle"></dxi-column>
        
        <div *dxTemplate="let dataAtr of 'tempAtributo'">
            <p>{{dataAtr.data.CODIGO_NOMBRE}}</p>
        </div> 
        <div *dxTemplate="let dataAtr of 'editTempAtributo'">
            <dx-lookup
                #listaAtributosSimple
                id="listaAtributosSimple"
                [dataSource]="DListaAtributos"
                displayExpr="CODIGO_NOMBRE"
                valueExpr="CODIGO"
                placeholder="Atributo"
                [value]="dataAtr.value"
                (onContentReady)="onContentReadyListaAtributosSimple($event)"
                (onValueChanged)="dataAtr.setValue($event.value)"
            >
            </dx-lookup>
        </div>
        
        <div *dxTemplate="let dataVlr of 'tempValorAtributo'">
            <p>{{dataVlr.data.VALOR}}</p>
        </div> 
        <div *dxTemplate="let dataVlr of 'editTempValorAtributo'">
            <dx-lookup
                [dataSource]="DListaValAtr"
                displayExpr="ATRIBUTO"
                valueExpr="ATRIBUTO"
                placeholder="Valor"
                [value]="dataVlr.value"
                (onValueChanged)="dataVlr.setValue($event.value)"
            >
            </dx-lookup>
        </div>

        <dxo-toolbar *ngIf="esEdicion">
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="plus" matTooltip="Nuevo" (onClick)="operGrid($event,'new', 'grid')" *ngIf="rowNew">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="edit" matTooltip="Actualizar" (onClick)="operGrid($event,'update', 'grid')" *ngIf="rowEdit">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="trash" matTooltip="Eliminar" (onClick)="operGrid($event,'delete', 'grid')" *ngIf="rowDelete">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="todo" matTooltip="Guardar" (onClick)="operGrid($event,'save', 'grid')" *ngIf="rowApplyChanges">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="undo" matTooltip="Cancelar" (onClick)="operGrid($event,'cancel', 'grid')" *ngIf="rowApplyChanges">
                </dx-button>
                </div>
            </dxi-item>
        </dxo-toolbar>
        
    </dx-data-grid>
</div>

<div *ngIf="clase===2">
    <dx-tree-list
        #treeListAtributos
        id="treeListAtributos"
        keyExpr="ITEM"
        parentIdExpr="ITEM_PADRE"
        columnResizingMode="nextColumn"
        rootValue="RAIZ"
        [dataSource]="DAtributos"
        [showRowLines]="true"
        [showBorders]="true"
        [columnAutoWidth]="true"
        [expandedRowKeys]="[1,2]"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [focusedRowEnabled]="true"
        [autoExpandAll]="true"
        [allowColumnResizing]="true"
        (onContentReady)="onContentReadyTreeListAtributos($event)"
        (onInitNewRow)="onInitNewRow($event, 'treeList')"
        (onRowInserting)="insertingRow($event, 'treeList')"
        (onRowInserted)="insertedRow($event, 'treeList')"
        (onRowUpdated)="updatedRow($event, 'treeList')"
        (onRowRemoved)="removedRow($event, 'treeList')"
        (onEditingStart)="onEditingStart($event, 'treeList')"
        (onRowPrepared)="onRowPrepared($event, 'treeList')"
        (onRowValidating)="onRowValidating($event, 'treeList')"
        (onSelectionChanged)="selectionGrid($event, 'treeList')"
        (onCellPrepared)="onCellPrepared($event, 'treeList')"
    >
        <dxo-editing 
            mode="cell"
            [useIcons]="false" 
            [allowUpdating]="esEdicion" 
            [allowDeleting]="false" 
            [allowAdding]="esEdicion">
            <dxo-texts
                confirmDeleteMessage="">
            </dxo-texts>
        </dxo-editing>
        <dxo-scrolling mode="standard"></dxo-scrolling>
        <dxo-search-panel [width]="250" [visible]="true"></dxo-search-panel>
        <dxo-selection 
            selectAllMode="allPages"
            [showCheckBoxesMode]="esVisibleSelecc" 
            mode="multiple">
        </dxo-selection>

        <dxi-column dataField="CODIGO" 
                    caption="Atributo" 
                    [setCellValue]="onSeleccAtributo"
                    cellTemplate="Atributo"
                    editCellTemplate="editAtributo"
                    calculateDisplayValue="CODIGO">
        </dxi-column>
        <dxi-column dataField="VALOR" 
                    caption="Valor"
                    [setCellValue]="onSeleccValAtr"
                    cellTemplate="tempValorAtributo"
                    calculateDisplayValue="VALOR">
            <dxo-lookup
                [dataSource]="DListaValAtr"
                displayExpr="ATRIBUTO"
                valueExpr="ATRIBUTO"
            >
            </dxo-lookup>
        </dxi-column>
        <dxi-column dataField="DETALLE" caption="Detalle"></dxi-column>

        <div *dxTemplate="let item of 'Atributo'">
            <div *ngIf="item.data.TIPO === 'old'">
                <span *ngIf="item.data.CODIGO === ''">{{ item.data.ATRIBUTO + ' -- ' + item.data.NOMBRE }}</span>
                <span *ngIf="item.data.CODIGO !== ''">{{ item.data.CODIGO + ' -- ' + item.data.NOMBRE }}</span>
            </div>
            <div *ngIf="item.data.TIPO === 'new'">
                <span *ngIf="item.data.CODIGO === ''">{{ item.data.ATRIBUTO + ' -- ' + item.data.NOMBRE }}</span>
                <span *ngIf="item.data.CODIGO !== ''">{{ item.data.CODIGO + ' -- ' + item.data.NOMBRE }}</span>
            </div>
        </div> 

        <div *dxTemplate="let dataVlr of 'tempValorAtributo'">
            <p>{{dataVlr.data.VALOR}}</p>
        </div>  
        <div *dxTemplate="let dataAtr of 'editAtributo'">
            <dx-lookup
                #listaAtributosCompuesto
                id="listaAtributosCompuesto"
                [dataSource]="DListaAtributos"
                displayExpr="CODIGO_NOMBRE"
                valueExpr="CODIGO"
                placeholder="Atributo"
                [value]="dataAtr.value"
                (onValueChanged)="dataAtr.setValue($event.value)"
            ></dx-lookup>
        </div>

        <div *dxTemplate="let dataVlr of 'editValorAtributo'">
            <dx-lookup
                [dataSource]="DListaValAtr"
                displayExpr="ATRIBUTO"
                valueExpr="ATRIBUTO"
                placeholder="Valor"
                [value]="dataVlr.value"
                (onValueChanged)="dataVlr.setValue($event.value)"
            ></dx-lookup>
        </div>

        <dxo-toolbar *ngIf="esEdicion">
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="plus" matTooltip="Nuevo" (onClick)="operGrid($event,'new', 'treelist')" *ngIf="rowNew">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="edit" matTooltip="Actualizar" (onClick)="operGrid($event,'update', 'treelist')" *ngIf="rowEdit">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="trash" matTooltip="Eliminar" (onClick)="operGrid($event,'delete', 'treelist')" *ngIf="rowDelete">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="todo" matTooltip="Guardar" (onClick)="operGrid($event,'save', 'treelist')" *ngIf="rowApplyChanges">
                </dx-button>
                </div>
            </dxi-item>
            <dxi-item location="before">
                <div *dxTemplate>
                    <dx-button icon="undo" matTooltip="Cancelar" (onClick)="operGrid($event,'cancel', 'treelist')" *ngIf="rowApplyChanges">
                </dx-button>
                </div>
            </dxi-item>
        </dxo-toolbar>

    </dx-tree-list>
</div>
