<dx-data-grid
    #gridProveedores
    id="gridProveedores"
    class="xt-datagrid"
    noDataText="" 
    [dataSource]="DProveedores"
    keyExpr="ITEM"
    [showBorders]="true"
    [focusedRowEnabled]="true"
    [rowAlternationEnabled]="true"
    [hoverStateEnabled]="true"
    [allowColumnResizing]="true"
    [columnAutoWidth]="true"
    columnResizingMode="widget"
    (onInitNewRow)="onInitNewRow($event)"
    (onRowInserting)="insertingRow($event)"
    (onRowInserted)="insertedRow($event)"
    (onRowUpdating)="updatingRow($event)"
    (onRowUpdated)="updatedRow($event)"
    (onRowRemoved)="removedRow($event)"
    (onEditingStart)="onEditingStart($event)"
    (onToolbarPreparing)="onToolbarPreparingGrid($event)"
    (onRowPrepared)="onRowPrepared($event)"
    (onRowValidating)="onRowValidating($event)"
    (onSelectionChanged)="selectionGrid($event)"
>

    <dxo-editing 
        mode="cell"
        [useIcons]="false" 
        [allowUpdating]="esEdicion" 
        [allowDeleting]="false" 
        [allowAdding]="esEdicion">
        <dxo-texts
            confirmDeleteMessage="">
        </dxo-texts>
    </dxo-editing>

    <dxo-selection 
        selectAllMode="allPages"     
        [showCheckBoxesMode]="esVisibleSelecc" 
        mode="multiple">
    </dxo-selection>

    <dxi-column 
        minWidth="100"
        dataField="ID_PROVEEDOR"
        caption="Proveedor"
        editCellTemplate="listaProveedores"
        calculateDisplayValue="ID_PROVEEDOR"
    ></dxi-column>
    <dxi-column
        minWidth="150"
        dataField="NOMBRE"
        caption="Nombre"
        [allowEditing]="false"
    ></dxi-column>
    <dxi-column dataField="REFERENCIA" caption="Referencia" calculateDisplayValue="REFERENCIA" >
    </dxi-column>
    <dxi-column 
        dataField="PRECIO" 
        caption="Precio"
        dataType="number"
        minWidth="120"
        [editorOptions]="{format: '#,##0.00'}" 
        >
        <dxo-format
            type="fixedPoint"
            [precision]="2">
        </dxo-format>
    </dxi-column>
    <dxi-column dataField="FECHA_NEGOCIADO" dataType="date" caption="Fecha registro"></dxi-column>
    <dxi-column 
        dataField="TIEMPO_ENTREGA" 
        dataType="number"
        [editorOptions]="{format: '#,##0.00'}" 
        caption="Tiempo entrega">
    </dxi-column>
    <dxi-column 
        dataField="PERIODO_ENTREGA" 
        caption="UM">
        <dxo-lookup
          [dataSource]="DTiempo"
          displayExpr="ID_UDM"
          valueExpr="ID_UDM">
        </dxo-lookup>
      </dxi-column>
    <dxi-column 
        dataField="ID_MONEDA" 
        caption="Moneda">
        <dxo-lookup
          [dataSource]="DMonedas"
          displayExpr="ID_MONEDA"
          valueExpr="ID_MONEDA">
        </dxo-lookup>
    </dxi-column>
    <dxi-column dataField="ULTIMA_ENTRADA" dataType="date" caption="Ult. Entrada" editCellTemplate="tempUltEntrega"></dxi-column>

    <div *dxTemplate="let cellInfo of 'listaProveedores'" >
      <dx-drop-down-box   
        #ddProveedor
        id="ddProveedor"
        [(value)]="cellInfo.value"
        [(opened)]="isGridBoxOpenedProv"
        valueExpr="ID_PROVEEDOR"
        displayExpr="ID_PROVEEDOR"
        placeholder="Proveedor"
        [showClearButton]="true"
        [dataSource]="DListaProv"
        [acceptCustomValue]="true"
        [readOnly]="readOnly"
        [dropDownOptions]="dropDownOptions"
        [inputAttr]="{style: 'text-transform: uppercase'}"
        (onValueChanged)="onValueChangedProv($event, cellInfo)"
        contentTemplate="contentTemplate"
      >
        <div *dxTemplate="let data of 'contentTemplate'">
            <dx-data-grid #gridSelectProveedores id="gridSelectProveedores"
              [focusedRowIndex]="focusedRowIndex"
              keyExpr="ID_PROVEEDOR"
              [dataSource]="DListaProv"
              [focusedRowEnabled]="true"
              [hoverStateEnabled]="true"
              [rowAlternationEnabled]="true"
              [hoverStateEnabled]="true"
              [(focusedRowKey)]="focusedRowKey"
              [autoNavigateToFocusedRow]="true"
              [(selectedRowKeys)]="gridBoxProveedor"
              height="100%"
              (onSelectionChanged)="onSeleccRowProv($event, cellInfo, data.component)"
              >
              <dxo-paging [pageSize]="200"> </dxo-paging>
              <dxo-pager
                [visible]="true"
                allowedPageSizes="[5, 10, 'all']"
                [showPageSizeSelector]="true"
                [showInfo]="true"
                [showNavigationButtons]="true">
              </dxo-pager>
              <dxo-search-panel [width]="250" [visible]="true" [width]="250" [(text)]="filterProveedor"></dxo-search-panel>
              <dxo-selection mode="single"></dxo-selection>
              <dxi-column dataField="ID_PROVEEDOR" caption="Proveedor" ></dxi-column>
              <dxi-column dataField="NOMBRE" caption="Nombre" ></dxi-column>
            </dx-data-grid>
        </div>
      </dx-drop-down-box>                    
    </div>
    
    <div *dxTemplate="let cellInfo of 'tempUltEntrega'">
        <dx-date-box
            #fechaDesde
            [(value)]="cellInfo.value"
            (onValueChanged)="onUltEntrega($event, cellInfo)"
        ></dx-date-box>
    </div>

    <dxo-toolbar *ngIf="esEdicion">
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="plus" matTooltip="Nuevo" (onClick)="operGrid($event,'new')" *ngIf="rowNew">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="edit" matTooltip="Actualizar" (onClick)="operGrid($event,'update')" *ngIf="rowEdit">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="trash" matTooltip="Eliminar" (onClick)="operGrid($event,'delete')" *ngIf="rowDelete">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="todo" matTooltip="Guardar" (onClick)="operGrid($event,'save')" *ngIf="rowApplyChanges">
            </dx-button>
            </div>
        </dxi-item>
        <dxi-item location="before">
            <div *dxTemplate>
                <dx-button icon="undo" matTooltip="Cancelar" (onClick)="operGrid($event,'cancel')" *ngIf="rowApplyChanges">
            </dx-button>
            </div>
        </dxi-item>
    </dxo-toolbar>
    
</dx-data-grid>
