<div id="splitterMain" class="row gx-3 h-250" style="height: 100%;">
  <div class="col-12">
    <div class="card-content">
      <dx-form
        #formRPro
        id="formRPro"
        labelLocation="left"
        [colCount]="1"
        [formData]="DRutasProductos"
        [readOnly]="readOnly"
      >
        <dxo-col-count-by-screen [xs]="1" [sm]="1" [md]="2" [lg]="2"></dxo-col-count-by-screen>
        <dxi-item dataField="ID_RUTA" [editorOptions]="{placeholder:'Id Ruta'}">
          <dxo-label text="Id Ruta"></dxo-label>
          <div *dxTemplate >
            <dx-text-box
              #textIDRuta
              placeholder="Código de Ruta"
              [(value)]="DRutasProductos.ID_RUTA"
              [readOnly]="true"
              (onValueChanged)="ValideExistencia($event)"
            ></dx-text-box>
          </div>
        </dxi-item>
        <dxi-item dataField="ESTADO" editorType="dxSelectBox">
          <dxo-label text="Estado"></dxo-label>
          <div *dxTemplate>
            <dx-select-box
              [dataSource]="['ACTIVO','INACTIVO']"
              [value]="DRutasProductos.ESTADO"
              [readOnly]="readOnly"
              placeholder="Seleccion Estado del Producto"
              (onValueChanged)="onSeleccEstado($event)"
            ></dx-select-box>
          </div>
        </dxi-item>
        <dxi-item dataField="DESCRIPCION" [editorOptions]="{placeholder:'Descripción de la ruta'}">
          <dxo-label text="Descripción"></dxo-label>
        </dxi-item>
      </dx-form>
    </div>
  </div>

  <as-split
    direction="horizontal"
    (dragEnd)="dragEnd('percent', $event)"
    #split="asSplit"
    class="col-12"
  >
    <as-split-area class="col-4" [size]="30" #area1="asSplitArea" >
      <div class="card-content-clean" style="flex-direction: column; height: 100%; margin-bottom: 0 !important;">
        <div style="height: 10%; padding: 10px 10px;">
          <span>Seleccione la ruta principal para el producto</span>
          <dx-select-box
            [dataSource]="listaRutaPpal"
            valueExpr="ID_RUTA"
            displayExpr="NOMBRE"
            placeholder="Ruta principal"
            [showClearButton]="true"
            [searchEnabled]="true"
            [grouped]="true"
            [disabled]="readOnly"                  
            [(value)]="rutaPriSelecc"
            (onValueChanged)="valueRutaPpal($event)"
          ></dx-select-box>
        </div>

        <div style="display: flex; height: 90%; flex-direction: column; align-items: flex-start; 
                    justify-items: flex-start; justify-content: center; padding: 10px 10px;"
        >
          <span style="margin: 10px 10px;">
            Rutas secundarias
          </span>
          <dx-list
          #listaRPartes
            id="listaRPartes"
            width="100%"
            height="100%"
            selectionMode="multiple"
            keyExpr="ID_RUTA"
            itemTemplate="dataRP"
            noDataText="No hay rutas secundarias"
            [searchExpr]="['ID_RUTA','DESCRIPCION']"
            searchMode="contains"
            [dataSource]="DRutasSimples"
            [searchEnabled]="true"
            [grouped]="true"
            [collapsibleGroups]="true"
            [hoverStateEnabled]="true"
            [showSelectionControls]="true"
            [selectedItemKeys]="lisSelRutasSimples"
            (onSelectionChanged)="onSelecRutasSimples($event)"
            [disabled]="readOnly"
          >
            <!-- [disabled]="diagReadOnly" -->
            <div *dxTemplate="let item of 'dataRP'">
              <dx-scroll-view width="100%" height="100%">
                <div class="container-info-rutas">
                  <div class="text-ellipsis">
                    <span>{{ item.DESCRIPCION }}</span>
                    <b>{{ item.ID_RUTA }}</b>
                    <!-- <div class="l-info"><i>{{ item.PRIORIDAD }}</i></div> -->
                  </div>
                  <div class="l-info">
                    <dx-button id="btnLoyoutRuta" #btnLoyoutRuta
                      icon="icon-ver-ol"
                      (onClick)="showVistaRutas($event, item.ID_RUTA)"
                    >
                      <i class="icon-ver-ol" ></i>
                    </dx-button>
                  </div>
                </div>
              </dx-scroll-view>
            </div>
          </dx-list>
        </div>
      </div>
    </as-split-area>
    <as-split-area class="col-8 ml-0" [size]="70" #area2="asSplitArea">
      <div class="card-content-clean" style="padding: 5px; margin-bottom: 0 !important;">
        <dx-diagram
          #diagProductos
          id="diagProductos"
          units="px"
          viewunits="px"
          class="dx-diagram-background"
          [readOnly]="diagReadOnly"
          autoZoomMode="fitWidth"
          [simpleView]="true"
          pageOrientation="landscape"
          (onContentReady)="onContentReady($event)"
          (onOptionChanged)="onOptionChanged($event)"
          (onRequestEditOperation)="requestEditOperationHandler($event)"
          (onRequestLayoutUpdate)="requestLayoutUpdateHandler($event)"
          (onSelectionChanged)="selectionChangedHandler($event)"
          (onCustomCommand)="onCustomMenuDiag($event)"
          >
          <!-- (onItemClick)="onItemClick($event)"
          (onItemDblClick)="onItemDblClick($event)" -->
          <dxo-default-item-properties style="stroke-width: 1px"></dxo-default-item-properties>
          <dxo-main-toolbar [visible]="true">
            <dxi-command name="toolbox" text="Herramientas"></dxi-command>
            <dxi-command name="undo" text="Deshacer"></dxi-command>
            <dxi-command name="redo" text="Rehacer"></dxi-command>
            <dxi-command name="separator"></dxi-command>
            <dxi-command name="fontName" text="Fuente"></dxi-command>
            <dxi-command name="fontSize" text="Tamaño Fuente"></dxi-command>
            <dxi-command name="separator"></dxi-command>
            <dxi-command name="bold" text="Negrita"></dxi-command>
            <dxi-command name="italic" text="Inclinar"></dxi-command>
            <dxi-command name="underline" text="Subrayar"></dxi-command>
            <dxi-command name="separator"></dxi-command>
            <dxi-command name="fontColor" text="Color Fuente"></dxi-command>
            <dxi-command name="lineColor" text="Color Linea"></dxi-command>
            <dxi-command name="fillColor" text="Color Fondo"></dxi-command>
            <dxi-command name="separator"></dxi-command>
            <dxi-command name="zoomLevel" text="Zoom"></dxi-command>
            <dxi-command
              name="clear"
              icon="clearsquare"
              text="Borrar Diagrama"
            ></dxi-command>
            <dxi-command
              name="cambio"
              icon="repeat"
              text="Cambiar Forma"
            ></dxi-command>
          </dxo-main-toolbar>
      
          <dxi-custom-shape
            *ngFor="let svgId of NodosSvg; let i = index"
            category="produccion"
            [type]="svgId.id"
            title="proceso"
            [backgroundImageUrl]="svgId.svg"
            [defaultWidth]="100"
            [defaultHeight]="60"
            defaultText=""
            [allowEditText]="false"
            [textWidth]=".55"
            [textLeft]="(1 - 0.55) / 2"
          >
            <dxi-connection-point [x]="0.25" [y]="0"></dxi-connection-point>
            <dxi-connection-point [x]="0.5" [y]="0"></dxi-connection-point>
            <dxi-connection-point [x]="0.75" [y]="0"></dxi-connection-point>
            <dxi-connection-point [x]="1" [y]="0.25"></dxi-connection-point>
            <dxi-connection-point [x]="1" [y]="0.5"></dxi-connection-point>
            <dxi-connection-point [x]="1" [y]="0.75"></dxi-connection-point>
            <dxi-connection-point [x]="0.25" [y]="1"></dxi-connection-point>
            <dxi-connection-point [x]="0.5" [y]="1"></dxi-connection-point>
            <dxi-connection-point [x]="0.75" [y]="1"></dxi-connection-point>
            <dxi-connection-point [x]="0" [y]="0.25"></dxi-connection-point>
            <dxi-connection-point [x]="0" [y]="0.5"></dxi-connection-point>
            <dxi-connection-point [x]="0" [y]="0.75"></dxi-connection-point>
          </dxi-custom-shape>
          <dxo-nodes
            [dataSource]="seccNodosDataSource"
            keyExpr="id"
            textExpr="text"
            typeExpr="type"
            leftExpr="x"
            topExpr="y"
            widthExpr="width"
            heightExpr="height"
            textStyleExpr="textStyle"
            styleExpr="itemStyleExpr"
            containerKeyExpr="contenedor"
            lockedExpr="bloqSeccion"
          >
            <!-- <dxo-auto-layout [type]="tipoAutoLayout" orientation="horizontal"></dxo-auto-layout> -->
            <dxo-auto-layout type="off"></dxo-auto-layout>
          </dxo-nodes>
          <dxo-edges
            [dataSource]="seccConecDataSource"
            keyExpr="id"
            fromExpr="fromId"
            toExpr="toId"
            textExpr="text"
            styleExpr="conecStyle"
            fromPointIndexExpr="fromPoint"
            toPointIndexExpr="toPoint"
            lockedExpr="bloqConn"
            pointsExpr="pointsConec"
            toLineEndExpr="tipoFlecha"
          ></dxo-edges>
          <dxo-toolbox visibility="hidden">
            <dxi-group category="general" title="General"></dxi-group>
            <dxi-group category="produccion" title="Producción"></dxi-group>
            <dxi-group category="containers" title="Containers"></dxi-group>
          </dxo-toolbox>

          <dxo-context-menu [enabled]="true" >
            <dxi-command name="desbloquear_secc" text="Des-bloquear" *ngIf="menuCommSeccion[0]"></dxi-command>
            <dxi-command name="bloquear_secc" text="Bloquear" *ngIf="menuCommSeccion[1]"></dxi-command>
            <!-- <dxi-command name="bloquear_con" text="Bloquear" *ngIf="menuCommSeccion[2]"></dxi-command>
            <dxi-command name="desbloquear_con" text="Des-bloquear" *ngIf="menuCommSeccion[3]"></dxi-command> -->
          </dxo-context-menu>
        </dx-diagram>
      </div>
    </as-split-area>
  </as-split>
</div>

<app-visor-img></app-visor-img>

<dx-load-panel
  #loaderPanel
  shadingColor="rgba(0,0,0,0.4)"
  [position]="{ of: '#router-container' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  message="Un momento. Cargando datos..."
  [hideOnOutsideClick]="false"
></dx-load-panel>
