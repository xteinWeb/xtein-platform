<div id="containerProCif" style="margin-top: 10px;">
  <dx-data-grid
    #gridCifDetalles
    id="gridCifDetalles"
    keyExpr="CODIGO"
    class="xt-subgrid"
    [dataSource]="DGDetalleCif"
    [columnAutoWidth]="true"
    [focusedRowEnabled]="true"
    [hoverStateEnabled]="true"
    [rowAlternationEnabled]="true"
    [showBorders]="true"
    [allowColumnResizing]="true"
    columnResizingMode="nextColumn"
    (onSelectionChanged)="selectionGrid($event)"
    (onEditingStart)="onEditingStart($event)"
    (onInitNewRow)="onInitNewRowPro($event)"
    (onRowValidating)="onRowValidating($event)"
    (onRowInserted)="onCalculateTotalCIF()"
    (onRowUpdated)="onCalculateTotalCIF()"
    (onRowRemoved)="onCalculateTotalCIF()"
  >
    <dxo-editing
      mode="cell"
      [useIcons]="false"
      [allowUpdating]="!readOnly"
      [allowDeleting]="false"
      [allowAdding]="!readOnly"
    >
      <dxo-texts
        confirmDeleteMessage="">
      </dxo-texts>
    </dxo-editing>
  
    <dxo-selection 
      selectAllMode="allPages"
      [showCheckBoxesMode]="esVisibleSelecc" 
      mode="multiple">
    </dxo-selection>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
  
    <dxi-column
      dataField="CODIGO"
      caption="Código"
      cssClass="clsEncabHis"
      alignment="left"
      [width]="150"
      editCellTemplate="temCIF"
    ></dxi-column>
  
    <dxi-column
      dataField="DESCRIPCION"
      caption="Nombre"
      cssClass="clsEncabHis"
      [width]="250"
      [editorOptions]="{ readOnly: true }"
    ></dxi-column>
  
    <dxi-column
      dataField="CANTIDAD"
      caption="Cantidad"
      dataType="number"
      alignment="right"
      [width]="100"
      [editorOptions]="{format: '#,##0.00', min:0}"
      [setCellValue]="onCalculateSubTotal"
      *ngIf="tipoCIF === 'Fijo'"
    >
      <dxo-format
        type="fixedPoint"
        [precision]="2">
      </dxo-format>
    </dxi-column>
  
    <dxi-column
      dataField="VALOR"
      caption="Valor"
      alignment="right"
      dataType="number"
      cssClass="clsEncabHis"
      [width]="150"
      cellTemplate="tempValorCif"
      editCellTemplate="tempValorCif"
    >
      <div *dxTemplate="let cellInfo of 'tempValorCif'">
        <dx-number-box
          #valorCif
          [min]="0"
          [readOnly]="true"
          [format]="cellInfo.data.formatValor"
          [value]="cellInfo.data.VALOR"
        ></dx-number-box>
      </div>
    </dxi-column>
  
    <dxi-column
      dataField="BASE"
      caption="Base CIF"
      editCellTemplate="temBASE"
      [width]="150"
      *ngIf="tipoCIF === 'Variable'"
    ></dxi-column>
  
    <dxi-column
      dataField="TOTAL"
      caption="Total"
      alignment="right"
      dataType="number"
      format="#,##0.0"
      [width]="130"
      [editorOptions]="{format: '#,##0.0', min:0, readOnly:true}"
    ></dxi-column>
  
    <div *dxTemplate="let cellInfo of 'temCIF'">
      <dx-drop-down-box
        #dropdowncif
        [(value)]="selectCIF"
        valueExpr="CODIGO"
        displayExpr="CODIGO"
        [showClearButton]="true"
        [dropDownOptions]="dropDownCif"
        [(opened)]="openCIF"
        [dataSource]="DGcif"
        (onOpened)="onOpenedCif($event)"
        (onClosed)="onClosedCif($event)"
      >
        <div *dxTemplate="let data of 'content'">
          <dx-data-grid
            class="xt-subgrid"
            #GDcif
            height="100%"
            width="100%"
            keyExpr="CODIGO"
            [dataSource]="DGcif"
            [(selectedRowKeys)]="selectCIF"
            [selection]="{ mode: 'single' }"
            [columnMinWidth]="100"
            [columnAutoWidth]="true"
            [allowColumnResizing]="true"
            [rowAlternationEnabled]="true"
            [focusedRowEnabled]="true"
            [hoverStateEnabled]="true"
            (onSelectionChanged)="onSelectionCIF($event, cellInfo)" 
          >
            <dxo-scrolling mode="virtual"></dxo-scrolling>
            <dxo-search-panel [visible]="true" [width]="widthSerchCif" ></dxo-search-panel>
            <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
  
            <dxi-column dataField="CODIGO" caption="Código" cssClass="clsEncabHis" [width]="150"></dxi-column>
            <dxi-column dataField="DESCRIPCION"  caption="Nombre" cssClass="clsEncabHis" [width]="230"></dxi-column>
          </dx-data-grid>
        </div>       
      </dx-drop-down-box>
    </div>
  
    <div *dxTemplate="let cellInfo of 'temValor'">
      <dx-number-box
        [min]="0"
        format="#,##0.00"
        [value]="cellInfo.value"
        [showSpinButtons]="true"
        [showClearButton]="true"
      ></dx-number-box>
    </div>
  
    <div *dxTemplate="let cellInfo of 'temBASE'">
      <dx-text-box
        [readOnly]="true"
        [value]="cellInfo.data.BASE">
      </dx-text-box>
    </div>
  
    <dxo-toolbar *ngIf="!readOnly">
      <dxi-item location="before">
        <div *dxTemplate>
          <dx-button icon="plus" matTooltip="Nuevo" (onClick)="operGrid($event,'new')" *ngIf="rowNew">
          </dx-button>
        </div>
      </dxi-item>
      <dxi-item location="before">
        <div *dxTemplate>
          <dx-button icon="edit" matTooltip="Actualizar" (onClick)="operGrid($event,'update')" *ngIf="rowEdit">
          </dx-button>
        </div>
      </dxi-item>
      <dxi-item location="before">
        <div *dxTemplate>
          <dx-button icon="trash" matTooltip="Eliminar" (onClick)="operGrid($event,'delete')" *ngIf="rowDelete">
          </dx-button>
        </div>
      </dxi-item>
      <dxi-item location="before">
        <div *dxTemplate>
          <dx-button icon="todo" matTooltip="Guardar" (onClick)="operGrid($event,'save')" *ngIf="rowApplyChanges">
          </dx-button>
        </div>
      </dxi-item>
      <dxi-item location="before">
        <div *dxTemplate>
          <dx-button icon="undo" matTooltip="Cancelar" (onClick)="operGrid($event,'cancel')" *ngIf="rowApplyChanges">
          </dx-button>
        </div>
      </dxi-item>
      <dxi-item location="before">
        <div *dxTemplate>
          <dx-button icon="pulldown" matTooltip="Refrescar" (onClick)="operGrid($event,'refrescar')" >
          </dx-button>
        </div>
      </dxi-item>
    </dxo-toolbar>
  
  </dx-data-grid>
</div>

<dx-load-panel
  #loaderPanel
  shadingColor="rgba(0,0,0,0.4)"
  [position]="{ of: '#gridCifDetalles' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  message="Un momento. Cargando datos..."
  [hideOnOutsideClick]="false"
></dx-load-panel>
