<div class="xtein-adm015-un">
  <xtein-data-grid
    #unGrid
    class="xtein-adm015-un__grid"
    [dataSource]="rows"
    keyExpr="ID_UN_ASOCIADA"
    [columns]="columns"
    height="auto"
    [searchEnabled]="false"
    [filterEnabled]="false"
    [selectionMode]="readOnly ? 'none' : 'multiple'"
    [selectedRowKeys]="selected"
    showCheckBoxesMode="always"
    (selectionChanged)="onSelectionChanged($event.selectedRowKeys)"
    [disabled]="busy"
    [toolbarVisible]="!readOnly"
    [toolbarActions]="toolbarActions"
    [toolbarTemplate]="listTrigger"
    [groupTemplate]="unCell"
    [pageSize]="20"
  />
</div>

<ng-template #listTrigger>
  @if (!readOnly) {
    <xtein-drop-down-panel
      class="xtein-adm015-un__list-trigger"
      placeholder="Lista de Unidades de Negocio"
      [opened]="listOpened"
      (openedChange)="openList($event)"
      [disabled]="busy || !!draft"
      [contentTemplate]="unList"
    />
  }
</ng-template>

<ng-template #unCell let-cell>
  @if (cell.column.dataField === 'VALOR_DEFECTO') {
    <div class="xtein-adm015-un__switch-cell">
      <dx-switch
        [value]="!!cell.value"
        [disabled]="readOnly || busy"
        (onValueChanged)="onToggleOperativa(cell.data, $event.value)"
      ></dx-switch>
    </div>
  } @else if (cell.column.dataField === 'ID_UN_ASOCIADA') {
    @if (draft && cell.data === draft) {
      <xtein-lookup
        [items]="selectableUNs"
        [columns]="lookupColumns"
        valueExpr="ID_UN"
        displayExpr="ID_UN"
        placeholder="Unidad de Negocio"
        ariaLabel="Unidad de Negocio a asociar"
        [autoFocus]="!draft.originalUnId"
        [ngModel]="draft.ID_UN_ASOCIADA === '__draft__' ? null : draft.ID_UN_ASOCIADA"
        (ngModelChange)="chooseUN($event)"
        [disabled]="busy"
      />
    } @else if (!readOnly) {
      <button
        type="button"
        class="xtein-adm015-un__code-btn"
        [disabled]="busy || !!draft"
        [attr.aria-label]="'Editar unidad ' + cell.value"
        (click)="beginEdit(cell.data)"
      >
        {{ cell.value }}
      </button>
    } @else {
      {{ cell.value }}
    }
  }
</ng-template>

<ng-template #unList>
  <div class="xtein-adm015-un__list-grid">
    <xtein-data-grid
      [dataSource]="choices"
      keyExpr="ID_UN"
      [columns]="choiceColumns"
      selectionMode="multiple"
      [selectedRowKeys]="choiceKeys"
      (selectionChanged)="choiceKeys = $event.selectedRowKeys"
      showCheckBoxesMode="always"
      [searchEnabled]="true"
      [filterEnabled]="false"
      [searchWidth]="300"
      [pageSize]="10"
      [allowedPageSizes]="[5, 10, 20]"
      [disabled]="busy || readOnly"
    />
  </div>
  <div class="xtein-adm015-un__list-actions">
    <xtein-button
      text="Aceptar"
      [disabled]="!choiceKeys.length || busy || readOnly"
      (clicked)="acceptList()"
    />
    <xtein-button
      text="Cancelar"
      variant="secondary"
      (clicked)="openList(false)"
    />
  </div>
</ng-template>
