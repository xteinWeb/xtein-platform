<section class="cal-003" [attr.aria-busy]="ctx.busy()">
  <!-- Cabecera: Movimiento | Estado · Documento | Usuario · Fecha de registro. El Movimiento se habilita con Nuevo;
       para ver registros, Buscar trae el campo Operación (Ajuste, Precios y Consultas se abren desde ahí). -->
  <div class="cal-003__top">
    <div class="cal-003__cabecera">
      <div class="cal-003__campo">
        <xtein-label class="cal-003__label" for="c3-movimiento">Movimiento</xtein-label>
        <div class="cal-003__control">
          <xtein-select id="c3-movimiento" ariaLabel="Movimiento" [items]="movimientos" valueExpr="id" displayExpr="label"
            [placeholder]="otraOperacion()" [ngModel]="seleccion()" (ngModelChange)="cambiarOperacion($event)" [readOnly]="!creando()" />
        </div>
      </div>
      <div class="cal-003__campo">
        <xtein-label class="cal-003__label">Estado</xtein-label>
        <div class="cal-003__control">
          @if (cabecera().estado) {
            <span class="c3-badge" [ngClass]="badge(cabecera().estado)">{{ cabecera().estado }}</span>
          } @else {
            <span class="cal-003__vacio">—</span>
          }
        </div>
      </div>
      <div class="cal-003__campo">
        <xtein-label class="cal-003__label" for="c3-documento">Documento</xtein-label>
        <div class="cal-003__control">
          <xtein-input id="c3-documento" ariaLabel="Documento" [placeholder]="cabecera().documento || (creando() ? 'Consultando…' : '')" [readOnly]="true" />
        </div>
      </div>
      <div class="cal-003__campo">
        <xtein-label class="cal-003__label" for="c3-usuario">Usuario</xtein-label>
        <div class="cal-003__control">
          <xtein-input id="c3-usuario" ariaLabel="Usuario" [placeholder]="cabecera().usuario" [readOnly]="true" />
        </div>
      </div>
      <div class="cal-003__campo">
        <xtein-label class="cal-003__label" for="c3-fecha-registro">Fecha de registro</xtein-label>
        <div class="cal-003__control">
          <xtein-input id="c3-fecha-registro" ariaLabel="Fecha de registro" [placeholder]="fecha(cabecera().fechaRegistro)" [readOnly]="true" />
        </div>
      </div>
    </div>
  </div>

  <div class="cal-003__panel" id="c3-panel-entrada" [hidden]="activa() !== tab.Entry">
    <xtein-cal003-entrada />
  </div>
  <div class="cal-003__panel" id="c3-panel-traslado" [hidden]="activa() !== tab.Transfer">
    <xtein-cal003-traslado />
  </div>
  <div class="cal-003__panel" id="c3-panel-entrega" [hidden]="activa() !== tab.Delivery">
    <xtein-cal003-entrega />
  </div>
  <div class="cal-003__panel" id="c3-panel-ajuste" [hidden]="activa() !== tab.Adjustment">
    <xtein-cal003-ajuste />
  </div>
  <div class="cal-003__panel" id="c3-panel-precios" [hidden]="activa() !== tab.Prices">
    <xtein-cal003-precios />
  </div>
  <div class="cal-003__panel" id="c3-panel-consultas" [hidden]="activa() !== tab.Queries">
    <xtein-cal003-consultas />
  </div>

  <!-- Buscar de la barra: modal estándar de la plataforma, uno solo para todas las operaciones -->
  <xtein-record-filter
    [visible]="filterVisible()"
    (visibleChange)="filterVisible.set($event)"
    [tableBase]="filterTable"
    (search)="buscar($event)"
  />

  <xtein-loading
    [visible]="ctx.busy()"
    message="Procesando servicios técnicos..."
    [showPane]="true"
    [showIndicator]="true"
    [shading]="true"
    [shadingOpacity]="0.18"
    [hideOnOutsideClick]="false"
  />
</section>
