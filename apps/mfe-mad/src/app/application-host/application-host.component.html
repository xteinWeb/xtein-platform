<div
  class="mad-application-host">

  <ng-container
    #applicationContainer>
  </ng-container>


  @if (loading()) {

    <div
      class="mad-application-host__state xt-app-state xt-app-state--overlay">

      <div
        class="mad-application-host__loading xt-app-state__spinner"
        aria-hidden="true">
      </div>

      <div
        class="xt-app-state__title">

        Cargando aplicación

      </div>

    </div>

  }


  @if (errorMessage()) {

    <div
      class="mad-application-host__state xt-app-state xt-app-state--overlay"
      role="alert">

      <div
        class="mad-application-host__error-icon xt-app-state__error-icon"
        aria-hidden="true">

        !

      </div>

      <div
        class="xt-app-state__title">

        Aplicación no disponible

      </div>

      <div
        class="mad-application-host__state-message xt-app-state__message">

        {{ errorMessage() }}

      </div>

    </div>

  }

</div>
