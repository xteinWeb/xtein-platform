<div class="xtein-financieros">
  <!-- Acordeón 1: Cupos -->
  <div class="xtein-accordion-item">
    <div class="xt-accordion__header xtein-accordion-header" (click)="toggleSection('cupo')">
      <div class="xt-accordion__icon xtein-accordion-icon">
        <svg *ngIf="expanded.cupo()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.cupo()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span>Cupos</span>
    </div>
    <div class="xt-accordion__body" *ngIf="expanded.cupo()">
      <!-- Frecuencia / Días de entrega -->
      <div class="xtein-financieros__top-row">
        <div class="xt-field xt-field--inline xtein-financieros__field xtein-financieros__field--frecuencia">
          <xtein-label class="xt-field__label" for="fin-tiempo">Frecuencia</xtein-label>
          <div class="xt-field__control xtein-financieros__control-frecuencia">
            <xtein-number
              id="fin-tiempo"
              [ngModel]="tiempoEntrega"
              (ngModelChange)="onTiempoChange($event)"
              [disabled]="readOnly"
              [readOnly]="readOnly"
              [min]="0"
              [showSpinButtons]="false"
              placeholder="0"
            ></xtein-number>
            <span class="xt-text-secondary">Días</span>
          </div>
        </div>
      </div>

      <div class="xtein-financieros__cards-grid">
        <!-- Card 1: Global -->
        <fieldset class="xt-fieldset xtein-financieros__fieldset">
          <legend class="xt-fieldset__legend xtein-financieros__legend">
            <xtein-group-label label="Global"></xtein-group-label>
          </legend>
          <div class="xtein-financieros__fieldset-content">
            <!-- Autorizado -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-cupo-credito">Autorizado</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-number
                  id="fin-cupo-credito"
                  [ngModel]="cupoCredito"
                  (ngModelChange)="onCupoCreditoChange($event)"
                  [disabled]="readOnly"
                  [readOnly]="readOnly"
                  [min]="0"
                  format="#,##0.00"
                  [showSpinButtons]="false"
                  placeholder="0.00"
                ></xtein-number>
              </div>
            </div>

            <!-- Estado -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-estado-cupo">Estado</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-input
                  id="fin-estado-cupo"
                  [ngModel]="estadoCupo"
                  [readOnly]="true"
                  [disabled]="true"
                ></xtein-input>
              </div>
            </div>

            <!-- Utilizado -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-cupo-utilizado">Utilizado</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-number
                  id="fin-cupo-utilizado"
                  [ngModel]="cupoUtilizado"
                  [readOnly]="true"
                  [disabled]="true"
                  [min]="0"
                  format="#,##0.00"
                  [showSpinButtons]="false"
                  placeholder="0.00"
                ></xtein-number>
              </div>
            </div>

            <!-- Disponible -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-cupo-disponible">Disponible</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-number
                  id="fin-cupo-disponible"
                  [ngModel]="cupoDisponible"
                  [readOnly]="true"
                  [disabled]="true"
                  [min]="0"
                  format="#,##0.00"
                  [showSpinButtons]="false"
                  placeholder="0.00"
                ></xtein-number>
              </div>
            </div>
          </div>
        </fieldset>

        <!-- Card 2: Cuota -->
        <fieldset class="xt-fieldset xtein-financieros__fieldset">
          <legend class="xt-fieldset__legend xtein-financieros__legend">
            <xtein-group-label label="Cuota"></xtein-group-label>
          </legend>
          <div class="xtein-financieros__fieldset-content">
            <!-- Autorizado -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-cupo-cuota">Autorizado</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-number
                  id="fin-cupo-cuota"
                  [ngModel]="cupoCuota"
                  (ngModelChange)="onCupoCuotaChange($event)"
                  [disabled]="readOnly"
                  [readOnly]="readOnly"
                  [min]="0"
                  format="#,##0.00"
                  [showSpinButtons]="false"
                  placeholder="0.00"
                ></xtein-number>
              </div>
            </div>

            <!-- Estado -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-estado-cuota">Estado</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-input
                  id="fin-estado-cuota"
                  [ngModel]="estadoCuota"
                  [readOnly]="true"
                  [disabled]="true"
                ></xtein-input>
              </div>
            </div>

            <!-- Utilizado -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-cupo-uti-cuota">Utilizado</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-number
                  id="fin-cupo-uti-cuota"
                  [ngModel]="cupoUtiCuota"
                  [readOnly]="true"
                  [disabled]="true"
                  [min]="0"
                  format="#,##0.00"
                  [showSpinButtons]="false"
                  placeholder="0.00"
                ></xtein-number>
              </div>
            </div>

            <!-- Disponible -->
            <div class="xt-field xt-field--inline xtein-financieros__field">
              <xtein-label class="xt-field__label" for="fin-cupo-dis-cuota">Disponible</xtein-label>
              <div class="xt-field__control xtein-financieros__control">
                <xtein-number
                  id="fin-cupo-dis-cuota"
                  [ngModel]="cupoDisCuota"
                  [readOnly]="true"
                  [disabled]="true"
                  [min]="0"
                  format="#,##0.00"
                  [showSpinButtons]="false"
                  placeholder="0.00"
                ></xtein-number>
              </div>
            </div>
          </div>
        </fieldset>
      </div>
    </div>
  </div>

  <!-- Acordeón 2: Condiciones -->
  <div class="xtein-accordion-item">
    <div class="xt-accordion__header xtein-accordion-header" (click)="toggleSection('condiciones')">
      <div class="xt-accordion__icon xtein-accordion-icon">
        <svg *ngIf="expanded.condiciones()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.condiciones()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span>Condiciones</span>
    </div>
    <div class="xt-accordion__body" [hidden]="!expanded.condiciones()">
      <xtein-condiciones
        [columns]="condicionColumns"
        [condiciones]="condiciones"
        [availableCondiciones]="$any(availableCondiciones)"
        [readOnly]="readOnly"
        (condicionesChange)="condicionesChange.emit($event)"
        (pendingChange)="pendingChange.emit()"
      />
    </div>
  </div>
</div>
