<div class="xtein-ubicaciones">
  <!-- Acordeón 1: Contacto -->
  <div class="xtein-accordion-item">
    <div class="xt-accordion__header xtein-accordion-header" (click)="toggleSection('contacto')">
      <div class="xt-accordion__icon xtein-accordion-icon">
        <svg *ngIf="expanded.contacto()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.contacto()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span>Contacto</span>
    </div>
    <div class="xt-accordion__body xtein-accordion-body" *ngIf="expanded.contacto()">
      <div class="xtein-ubicaciones__form-grid">
        <div class="xt-field xt-field--inline xtein-ubicaciones__field">
          <xtein-label class="xt-field__label" for="cli-url">Url/Website</xtein-label>
          <div class="xt-field__control xtein-ubicaciones__control">
            <xtein-input
              id="cli-url"
              [(ngModel)]="contactoAdicional.URL"
              (ngModelChange)="updateContacto()"
              [readOnly]="readOnly"
              placeholder="https://www.ejemplo.com"
            ></xtein-input>
          </div>
        </div>

        <div class="xt-field xt-field--inline xtein-ubicaciones__field">
          <xtein-label class="xt-field__label" for="cli-ciiu">Actividad económica</xtein-label>
          <div class="xt-field__control xtein-ubicaciones__control">
            <xtein-input
              id="cli-ciiu"
              [(ngModel)]="contactoAdicional.CIIU"
              (ngModelChange)="updateContacto()"
              [readOnly]="readOnly"
              placeholder="Código CIIU"
            ></xtein-input>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Acordeón 2: Correos -->
  <div class="xtein-accordion-item">
    <div class="xt-accordion__header xtein-accordion-header" (click)="toggleSection('correos')">
      <div class="xt-accordion__icon xtein-accordion-icon">
        <svg *ngIf="expanded.correos()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.correos()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span>Correos</span>
    </div>
    <div class="xt-accordion__body xtein-accordion-body" *ngIf="expanded.correos()">
      <xtein-correos [emails]="emails" [readOnly]="readOnly" (emailsChange)="emailsChange.emit($event)" (pendingChange)="pendingChange.emit()" />
    </div>
  </div>

  <!-- Acordeón 3: Direcciones -->
  <div class="xtein-accordion-item">
    <div class="xt-accordion__header xtein-accordion-header" (click)="toggleSection('direcciones')">
      <div class="xt-accordion__icon xtein-accordion-icon">
        <svg *ngIf="expanded.direcciones()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.direcciones()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span>Direcciones</span>
    </div>
    <div class="xt-accordion__body xtein-accordion-body" [hidden]="!expanded.direcciones()">
      <xtein-direcciones [direcciones]="direcciones" [readOnly]="readOnly" (direccionesChange)="direccionesChange.emit($event)" (pendingChange)="pendingChange.emit()" />
    </div>
  </div>

  <!-- Acordeón 4: Teléfonos -->
  <div class="xtein-accordion-item">
    <div class="xt-accordion__header xtein-accordion-header" (click)="toggleSection('telefonos')">
      <div class="xt-accordion__icon xtein-accordion-icon">
        <svg *ngIf="expanded.telefonos()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.telefonos()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span>Teléfonos</span>
    </div>
    <div class="xt-accordion__body xtein-accordion-body" [hidden]="!expanded.telefonos()">
      <xtein-telefonos [telefonos]="telefonos" [readOnly]="readOnly" (telefonosChange)="telefonosChange.emit($event)" (pendingChange)="pendingChange.emit()" />
    </div>
  </div>
</div>
