<div class="xtein-financieros">
  <!-- Acordeón 1: Cupo -->
  <div class="xtein-accordion-item">
    <div class="xtein-accordion-header" (click)="toggleSection('cupo')">
      <div class="xtein-accordion-icon">
        <svg *ngIf="expanded.cupo()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.cupo()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span class="xtein-accordion-title">Cupo</span>
    </div>
    <div class="xtein-accordion-body" *ngIf="expanded.cupo()">
      <div class="xtein-financieros__form-grid">
        <div class="xtein-financieros__field-inline">
          <xtein-label class="xtein-financieros__label-inline" for="fin-cupo">Cupo crédito</xtein-label>
          <div class="xtein-financieros__control-inline">
            <xtein-number
              id="fin-cupo"
              [ngModel]="cupoCredito"
              (ngModelChange)="onCupoChange($event)"
              [disabled]="readOnly"
              [readOnly]="readOnly"
              [min]="0"
              [showSpinButtons]="false"
              placeholder="0"
            ></xtein-number>
          </div>
        </div>

        <div class="xtein-financieros__field-inline">
          <xtein-label class="xtein-financieros__label-inline" for="fin-tiempo">Días entrega</xtein-label>
          <div class="xtein-financieros__control-inline">
            <xtein-number
              id="fin-tiempo"
              [ngModel]="tiempoEntrega"
              (ngModelChange)="onTiempoChange($event)"
              [disabled]="readOnly"
              [readOnly]="readOnly"
              [min]="0"
              [showSpinButtons]="false"
              placeholder="0"
            ></xtein-number>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Acordeón 2: Condiciones -->
  <div class="xtein-accordion-item">
    <div class="xtein-accordion-header" (click)="toggleSection('condiciones')">
      <div class="xtein-accordion-icon">
        <svg *ngIf="expanded.condiciones()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!expanded.condiciones()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span class="xtein-accordion-title">Condiciones</span>
    </div>
    <div class="xtein-accordion-body" [hidden]="!expanded.condiciones()">
      <xtein-condiciones
        [columns]="condicionColumns"
        [condiciones]="condiciones"
        [availableCondiciones]="$any(availableCondiciones)"
        [readOnly]="readOnly"
        (condicionesChange)="condicionesChange.emit($event)"
        (pendingChange)="pendingChange.emit()"
      />
    </div>
  </div>
</div>
