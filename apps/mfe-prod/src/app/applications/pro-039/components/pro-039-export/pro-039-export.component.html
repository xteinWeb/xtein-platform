<dx-popup
  [visible]="visible" (visibleChange)="!$event && close()"
  title="Exportar a Excel"
  [showTitle]="isMobile()" [showCloseButton]="!busy"
  [shading]="isMobile()"
  [hideOnOutsideClick]="!busy"
  [position]="position()"
  width="min(560px, 96vw)" height="auto">
  <div *dxTemplate="let content of 'content'" class="xtein-pro039-export">
    @if (busy) { <p class="xtein-pro039-export__status xt-panel" role="status">Generando Excel… puede tardar unos segundos.</p> }
    <article class="xtein-pro039-export__item xt-option-list__row" aria-label="Consumos en Excel">
      <i class="dx-icon-xlsxfile xtein-pro039-export__icon" aria-hidden="true"></i>
      <div class="xtein-pro039-export__text">
        <h3 class="xtein-pro039-export__name xt-field__value xt-text-strong">Consumos</h3>
        <span class="xtein-pro039-export__detail xt-hint">
          {{ scope() === 'actual' ? (current || 'Registro actual') : 'Todos los consultados (' + total + ')' }}
        </span>
      </div>
      <div class="xtein-pro039-export__actions">
        <xtein-button icon="icon-seleccionada-ol" ariaLabel="Solo registro actual" [width]="32"
          [variant]="scope() === 'actual' ? 'primary' : 'link'" [pressed]="scope() === 'actual'"
          [disabled]="busy" (clicked)="select('actual')" />
        <xtein-button icon="icon-seleccionar-todas-alt-sl" ariaLabel="Todos los registros consultados" [width]="32"
          [variant]="scope() === 'todos' ? 'primary' : 'link'" [pressed]="scope() === 'todos'"
          [disabled]="busy || total < 1" (clicked)="select('todos')" />
        <span class="xtein-pro039-export__separator xt-totals__divider" aria-hidden="true"></span>
        <xtein-button icon="xlsxfile" ariaLabel="Descargar Excel" [width]="32" variant="link"
          [disabled]="busy" (clicked)="export()" />
      </div>
    </article>
  </div>
</dx-popup>
