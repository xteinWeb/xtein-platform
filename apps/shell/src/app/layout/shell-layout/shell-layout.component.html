<div
  class="xt-shell"
  [class.xt-shell--sidebar-collapsed]="sidebarCollapsed()"
  [class.xt-shell--compact]="compactLayout()">

  <!-- Header -->
  <header
    class="xt-shell__header">

    <app-header>
    </app-header>

  </header>


  <!-- Main navigation -->
  <aside
    class="xt-shell__sidebar">

    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      (collapsedChange)="setSidebarCollapsed($event)">
    </app-sidebar>

  </aside>


  <!-- Backdrop of the floating sidebar (compact viewports) -->
  @if (compactLayout() && !sidebarCollapsed()) {
    <div
      class="xt-shell__backdrop"
      aria-hidden="true"
      (click)="closeFloatingSidebar()">
    </div>
  }


  <!-- Main workspace -->
  <main
    class="xt-shell__main">

    <div
      class="xt-shell__workspace">

      <app-workspace>
      </app-workspace>

    </div>

  </main>

</div>
