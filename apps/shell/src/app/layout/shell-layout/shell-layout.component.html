<div
  class="xt-shell"
  [class.xt-shell--sidebar-open]="sidebarOpen()">

  <!-- Header -->
  <header
    class="xt-shell__header">

    <app-header
      [menuOpen]="sidebarOpen()"
      (menuToggle)="toggleSidebar()">
    </app-header>

  </header>


  <!-- Backdrop: a click outside the floating navigation closes it -->
  @if (sidebarOpen()) {

    <div
      class="xt-shell__backdrop"
      aria-hidden="true"
      (click)="closeSidebar()">
    </div>

  }


  <!-- Main navigation, floating over the workspace -->
  <aside
    id="xt-shell-navigation"
    class="xt-shell__sidebar"
    [attr.aria-hidden]="!sidebarOpen()"
    [attr.inert]="sidebarOpen() ? null : ''">

    <app-sidebar
      (closeRequested)="closeSidebar()"
      (applicationOpened)="closeSidebar()">
    </app-sidebar>

  </aside>


  <!-- Main workspace -->
  <main
    class="xt-shell__main">

    <div
      class="xt-shell__workspace">

      <app-workspace>
      </app-workspace>

    </div>

  </main>

</div>
