<aside class="xt-sidebar">
  <!-- ======================================================
       HEADER
       ====================================================== -->

  <div class="xt-sidebar__header">
    <dx-button
      class="xt-sidebar__toggle"
      icon="menu"
      stylingMode="text"
      type="normal"
      hint="Cerrar menú"
      (onClick)="closeRequested.emit()"
    >
    </dx-button>

    <div class="xt-sidebar__brand">
      <img
        class="xt-sidebar__logo"
        src="/assets/img/logo/xtein.svg"
        alt="XTEIN"
      />
    </div>
  </div>

  <!-- ======================================================
       LOADING
       ====================================================== -->

  @if (loading) {
    <div class="xt-sidebar__loading">
      <dx-load-indicator [height]="28" [width]="28"> </dx-load-indicator>
    </div>
  }

  <!-- ======================================================
       NAVIGATION LOAD ERROR
       ====================================================== -->

  @if (!loading && error) {
    <div class="xt-sidebar__error">
      {{ error }}
    </div>
  }

  <!-- ======================================================
       APPLICATION OPEN ERROR
       ====================================================== -->

  @if (!loading && launchError) {
    <div class="xt-sidebar__error">
      {{ launchError }}
    </div>
  }

  <!-- ======================================================
       NAVIGATION TREE
       ====================================================== -->

  @if (!loading && !error) {
    <div class="xt-sidebar__navigation">
      <dx-tree-view
        class="xt-sidebar__tree xt-treeview"
        dataStructure="plain"
        keyExpr="applicationId"
        parentIdExpr="parentApplicationId"
        displayExpr="name"
        [rootValue]="treeRootValue"
        selectionMode="single"
        expandEvent="click"
        searchMode="contains"
        noDataText="No se encontraron aplicaciones"
        [items]="navigationItems"
        [searchEnabled]="true"
        [searchEditorOptions]="searchEditorOptions"
        [selectByClick]="true"
        [focusStateEnabled]="true"
        [hoverStateEnabled]="true"
        (onItemClick)="onNavigationItemClick($event)"
      >
        <div
          *dxTemplate="let item of 'item'"
          class="xt-navigation-item"
        >
          <i
            class="xt-navigation-item__icon"
            [class]="'xt-navigation-item__icon ' + resolveIconClass(item)"
            aria-hidden="true"
          >
          </i>

          <span class="xt-navigation-item__text">
            {{ item.name }}
          </span>
        </div>
      </dx-tree-view>
    </div>
  }
</aside>
