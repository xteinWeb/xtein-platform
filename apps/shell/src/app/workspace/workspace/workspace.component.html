<div class="xt-workspace">

  <div class="xt-workspace__tabs">

    <div class="xt-tab xt-tab--active">
      Orígenes de Datos
      <span>×</span>
    </div>

    <div class="xt-tab">
      Tablero
    </div>

  </div>

  <div class="xt-workspace__content">

    <div class="xt-placeholder">

      <h2>
        Workspace XTEIN
      </h2>

      <p>
        Aquí se cargarán dinámicamente los microfrontends.
      </p>

      <xtein-ui>
      </xtein-ui>

      <hr>

      <h3>
        XTEIN UI Test
      </h3>

      <div
        class="mt-3"
        style="width: 300px;">

        <xtein-input
          id="testUser"
          name="testUser"
          appearance="login"
          iconClass="icon-usuario"
          ariaLabel="Usuario"
          placeholder="Usuario/Nombre de usuario"
          autocomplete="off"
          [required]="true"
          [formControl]="testUserControl">
        </xtein-input>

      </div>

      <div class="mt-3">

        <strong>
          FormControl value:
        </strong>

        {{ testUserControl.value }}

      </div>

    </div>

  </div>

</div>
