<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <title>Xtein</title>

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <link
    rel="icon"
    type="image/svg+xml"
    href="/assets/img/logo/xtein-i-logo.svg">


  <style>

    /*
     * Initial XTEIN bootstrap loading screen.
     *
     * This loader is intentionally defined directly in index.html
     * because it must be available before Angular, Native Federation,
     * DevExtreme and the shared UI library are initialized.
     */

    :root {

      --xt-bootstrap-background:
        #f5f8fc;

      --xt-bootstrap-primary:
        #0f4d80;

      --xt-bootstrap-secondary:
        #0e95e8;

      --xt-bootstrap-track:
        rgba(
          15,
          77,
          128,
          0.14
        );

      --xt-bootstrap-text:
        #5f7182;
    }


    html,
    body {

      width:
        100%;

      height:
        100%;

      margin:
        0;

      padding:
        0;
    }


    body {

      overflow:
        hidden;
    }


    .xt-bootstrap-loading {

      position:
        fixed;

      inset:
        0;

      z-index:
        2147483647;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        100%;

      height:
        100%;

      background:
        var(
          --xt-bootstrap-background
        );
    }


    .xt-bootstrap-loading__content {

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      gap:
        20px;

      padding:
        32px;

      text-align:
        center;
    }


    .xt-bootstrap-loading__logo {

      display:
        block;

      width:
        150px;

      max-width:
        60vw;

      height:
        auto;
    }


    .xt-bootstrap-loading__indicator {

      width:
        38px;

      height:
        38px;

      box-sizing:
        border-box;

      border:
        4px solid
        var(
          --xt-bootstrap-track
        );

      border-top-color:
        var(
          --xt-bootstrap-secondary
        );

      border-radius:
        50%;

      animation:
        xt-bootstrap-loading-spin
        0.8s
        linear
        infinite;
    }


    .xt-bootstrap-loading__message {

      margin:
        0;

      color:
        var(
          --xt-bootstrap-text
        );

      font-family:
        Roboto,
        Arial,
        sans-serif;

      font-size:
        14px;

      font-weight:
        400;

      line-height:
        1.4;

      letter-spacing:
        0.01em;
    }


    @keyframes xt-bootstrap-loading-spin {

      to {

        transform:
          rotate(
            360deg
          );
      }
    }


    @media (
      prefers-reduced-motion:
        reduce
    ) {

      .xt-bootstrap-loading__indicator {

        animation-duration:
          1.6s;
      }
    }

  </style>

</head>


<body class="mat-typography">

  <app-root>

    <div
      class="xt-bootstrap-loading"
      role="status"
      aria-live="polite"
      aria-label="Cargando plataforma">

      <div
        class="xt-bootstrap-loading__content">

        <img
          class="xt-bootstrap-loading__logo"
          src="/assets/img/logo/xtein.svg"
          alt="XTEIN">

        <div
          class="xt-bootstrap-loading__indicator"
          aria-hidden="true">
        </div>

        <p
          class="xt-bootstrap-loading__message">

          Cargando plataforma...

        </p>

      </div>

    </div>

  </app-root>

</body>

</html>
