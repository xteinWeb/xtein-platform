# SonarQube Community Build + PostgreSQL para dev2026 (http://<ip-dev2026>:9000).
# Requisito del host (Elasticsearch interno): vm.max_map_count=524288 en /etc/sysctl.conf.
# La clave de la BD va en un archivo .env junto a este (SONAR_DB_PASSWORD=...), nunca en el repo.
# Levantar: docker compose up -d   ·   Logs: docker compose logs -f sonarqube
services:
  sonarqube:
    image: sonarqube:community
    depends_on: [db]
    ports: ["9000:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Falta SONAR_DB_PASSWORD en .env}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Falta SONAR_DB_PASSWORD en .env}
      POSTGRES_DB: sonar
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  pg_data:
