<xtein-dashboard-frame>
  @if (loading()) { <p role="status">Cargando dashboard…</p> }
  @if (error()) { <p role="alert">{{ error() }}</p> }
  @if (definition(); as dashboard) {
    <xtein-dashboard-viewer [dashboardId]="dashboard.dashboardId" [dashboardType]="dashboard.dashboardType" />
  }
</xtein-dashboard-frame>
