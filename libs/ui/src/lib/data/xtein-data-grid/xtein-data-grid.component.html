<dx-data-grid [dataSource]="dataSource" [keyExpr]="keyExpr" [columns]="resolvedColumns" [height]="height" [disabled]="disabled"
  [columnAutoWidth]="true" [hoverStateEnabled]="true" [showBorders]="true" [selectedRowKeys]="selectedRowKeys"
  noDataText="Sin datos" (onSelectionChanged)="selectionChanged.emit($event)" (onEditingStart)="editingStart.emit($event)"
  (onRowClick)="rowClick.emit($event)" (onKeyDown)="keyDown($event)">
  <dxo-selection [mode]="selectionMode" [showCheckBoxesMode]="showCheckBoxesMode" selectAllMode="allPages" />
  <dxo-editing mode="cell" [allowUpdating]="allowUpdating" />
  <dxo-search-panel [visible]="searchEnabled" [placeholder]="searchPlaceholder" [width]="searchWidth" />
  <dxo-filter-row [visible]="filterEnabled" /><dxo-header-filter [visible]="filterEnabled" />
  <dxo-scrolling [mode]="scrollingMode" />
  <dxo-paging [pageSize]="pageSize" />
  <dxo-pager [visible]="showPager" [showPageSizeSelector]="true" [allowedPageSizes]="allowedPageSizes" [showInfo]="true" [showNavigationButtons]="true" />
  <dxo-toolbar [visible]="hasToolbar">
    @if (toolbarActions.length > 0) {
      <dxi-item location="before">
        <div *dxTemplate>
          <xtein-grid-toolbar [actions]="toolbarActions" (actionClick)="handleToolbarAction($event)" />
        </div>
      </dxi-item>
    }

    @if (toolbarTemplate) {
      <dxi-item location="before">
        <div *dxTemplate class="xtein-grid-toolbar-custom">
          <ng-container [ngTemplateOutlet]="toolbarTemplate" />
        </div>
      </dxi-item>
    }

    @if (searchEnabled) {
      <dxi-item name="searchPanel" location="after" />
    }
  </dxo-toolbar>

  <div *dxTemplate="let cell of 'xteinGroup'">
    @if (groupTemplate) { <ng-container [ngTemplateOutlet]="groupTemplate" [ngTemplateOutletContext]="{$implicit:cell}" /> }
    @else { {{cell.text}} }
  </div>
</dx-data-grid>
