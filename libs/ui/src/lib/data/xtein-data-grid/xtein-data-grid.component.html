<dx-data-grid [dataSource]="dataSource" [keyExpr]="keyExpr" [columns]="resolvedColumns" [height]="height" [disabled]="disabled"
  [columnAutoWidth]="true" [hoverStateEnabled]="true" [showBorders]="true" [selectedRowKeys]="selectedRowKeys"
  noDataText="Sin datos" (onSelectionChanged)="selectionChanged.emit($event)" (onEditingStart)="editingStart.emit($event)"
  (onRowClick)="rowClick.emit($event)" (onKeyDown)="keyDown($event)">
  <dxo-selection [mode]="selectionMode" selectAllMode="allPages" />
  <dxo-editing mode="cell" [allowUpdating]="allowUpdating" />
  <dxo-search-panel [visible]="searchEnabled" [placeholder]="searchPlaceholder" [width]="searchWidth" />
  <dxo-filter-row [visible]="filterEnabled" /><dxo-header-filter [visible]="filterEnabled" />
  <dxo-scrolling [mode]="scrollingMode" />
  <dxo-paging [pageSize]="pageSize" />
  <dxo-pager [visible]="showPager" [showPageSizeSelector]="true" [allowedPageSizes]="allowedPageSizes" [showInfo]="true" [showNavigationButtons]="true" />
  <dxo-toolbar [visible]="hasToolbar">
    @if (toolbarActions.length > 0) {
      <dxi-item location="before">
        <div *dxTemplate class="xtein-grid-toolbar-actions">
          @for (btn of toolbarActions; track btn.id) {
            @if (btn.visible !== false) {
              <button
                type="button"
                class="xtein-grid-btn"
                [ngClass]="'xtein-grid-btn--' + (btn.variant || 'secondary')"
                [attr.aria-label]="btn.title || btn.text || btn.id"
                [title]="btn.title || btn.text || ''"
                [disabled]="btn.disabled || disabled"
                (click)="handleToolbarAction(btn)"
              >
                @if (btn.icon === 'plus') {
                  <svg class="xtein-grid-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                } @else if (btn.icon === 'check') {
                  <svg class="xtein-grid-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                } @else if (btn.icon === 'undo') {
                  <svg class="xtein-grid-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7v6h6"></path>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                  </svg>
                } @else if (btn.icon === 'trash') {
                  <svg class="xtein-grid-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                } @else if (btn.icon === 'refresh') {
                  <svg class="xtein-grid-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                  </svg>
                } @else if (btn.icon === 'edit') {
                  <svg class="xtein-grid-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                }
                @if (btn.text) {
                  <span class="xtein-grid-btn-text">{{ btn.text }}</span>
                }
              </button>
            }
          }
        </div>
      </dxi-item>
    }

    @if (toolbarTemplate) {
      <dxi-item location="before">
        <div *dxTemplate class="xtein-grid-toolbar-custom">
          <ng-container [ngTemplateOutlet]="toolbarTemplate" />
        </div>
      </dxi-item>
    }

    @if (searchEnabled) {
      <dxi-item name="searchPanel" location="after" />
    }
  </dxo-toolbar>

  <div *dxTemplate="let cell of 'xteinGroup'">
    @if (groupTemplate) { <ng-container [ngTemplateOutlet]="groupTemplate" [ngTemplateOutletContext]="{$implicit:cell}" /> }
    @else { {{cell.text}} }
  </div>
</dx-data-grid>
