@if (label) { <label class="form-label" [attr.for]="id">{{ label }} @if(required){<span aria-hidden="true">*</span>}</label> }
<dx-date-box type="date" pickerType="calendar" stylingMode="filled" displayFormat="dd/MM/yyyy"
  dateSerializationFormat="yyyy-MM-dd" [value]="value" [min]="min" [max]="max"
  [readOnly]="readOnly" [disabled]="isDisabled" [placeholder]="placeholder" [inputAttr]="inputAttributes"
  (onValueChanged)="changed($event)" (onFocusOut)="onTouched()" />
