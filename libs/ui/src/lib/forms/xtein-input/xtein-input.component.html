@if (label) { <xtein-label [for]="id" [required]="required" [disabled]="isDisabled" [invalid]="isInvalidField">{{label}}</xtein-label> }
<dx-text-box
  class="w-100"
  stylingMode="filled"
  valueChangeEvent="input"
  [value]="value"
  [placeholder]="placeholder"
  [disabled]="isDisabled"
  [readOnly]="readOnly"
  [maxLength]="maxLength ?? ''"
  [inputAttr]="inputAttributes"
  [isValid]="computedIsValid"
  [validationStatus]="computedValidationStatus"
  [validationErrors]="validationErrors"
  [class.dx-valid]="validationStatus === 'valid'"
  [class.dx-invalid]="computedValidationStatus === 'invalid'"
  [class.dx-show-invalid-badge]="computedValidationStatus === 'invalid'"
  (onValueChanged)="handleValueChanged($event)"
  (onFocusOut)="handleFocusOut()"
  (onEnterKey)="handleEnterKey()">
</dx-text-box>

@if (isInvalidField && errorMessage) {

  <div
    class="invalid-feedback d-block"
    role="alert">

    {{ errorMessage }}

  </div>

}
