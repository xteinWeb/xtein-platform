<dx-number-box
  class="w-100"
  [tabIndex]="tabIndex"
  [inputAttr]="{
    id: id,
    name: name,
    'aria-label': ariaLabel || placeholder || name
  }"
  [value]="$any(value)"
  [placeholder]="placeholder"
  [disabled]="disabled || readOnly"
  [readOnly]="readOnly"
  [min]="min"
  [max]="max"
  [step]="step"
  [format]="format"
  [showSpinButtons]="showSpinButtons"
  [showClearButton]="!required && !readOnly && !disabled"
  [stylingMode]="stylingMode"
  (onValueChanged)="onValueChanged($event)"
  (onFocusOut)="onFocusOut()">
</dx-number-box>
