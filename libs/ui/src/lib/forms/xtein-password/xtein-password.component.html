@if (label) { <xtein-label [for]="id" [required]="required" [invalid]="invalid">{{label}}</xtein-label> }
<dx-text-box
  class="w-100"
  stylingMode="filled"
  [mode]="passwordVisible ? 'text' : 'password'"
  valueChangeEvent="input"
  [value]="value"
  [placeholder]="placeholder"
  [disabled]="isDisabled"
  [readOnly]="readOnly"
  [maxLength]="maxLength"
  [inputAttr]="inputAttributes"
  (onValueChanged)="handleValueChanged($event)"
  (onFocusOut)="handleFocusOut()">

  <dxi-button
    name="togglePassword"
    location="after"
    [options]="toggleButtonOptions">
  </dxi-button>

</dx-text-box>

@if (invalid && errorMessage) {

  <div
    class="invalid-feedback d-block"
    role="alert">

    {{ errorMessage }}

  </div>

}
