# Análisis estático con SonarQube (Community Build en dev2026). Lo lanza el job "sonarqube" de
# .github/workflows/desplegar.yml; el servidor y el token llegan por los secretos SONAR_HOST_URL y SONAR_TOKEN.
# Se analiza solo la plataforma nueva (apps y libs); Legacy y database quedan fuera.
sonar.projectKey=Xtein-Platform
sonar.projectName=Xtein Platform
sonar.sourceEncoding=UTF-8

sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
