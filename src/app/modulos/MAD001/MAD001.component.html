<!-- NUEVO CONTENEDOR PRINCIPAL CON DOS PANELES -->
<div class="MAD001-main-container">
  
  <!-- ========== PANEL IZQUIERDO: ÁRBOL DE APLICACIONES ========== -->
  <div [hidden]="!mostrarArbol">
    <div class="MAD001-arbol-panel" [class.panel-colapsado]="!arbolVisible">         

      <!-- Componente Árbol Genérico -->
      <div class="arbol-wrapper" [class.arbol-oculto]="!arbolVisible">
        <app-generic-tree
          [dataSource]="aplicacionesTree"
          [fieldConfig]="{
            idField: 'ID_APLICACION',
            parentIdField: 'ID_APLICACION_PADRE',
            prefix: 'ID_APLICACION',
            displayFields: ['NOMBRE'],
            statusField: 'ESTADO',
            searchFields: ['NOMBRE']
          }"
          [searchEnabled]="true"
          [showCheckBoxes]="false"
          [selectionMode]="'single'"
          [expandAllOnLoad]="true"
          [showChildPrefix]="true"        
          [showParentStatus]="true"        
          [showChildStatus]="true"        
          (itemClick)="onAplicacionTreeClick($event)">
        </app-generic-tree>
      </div>

      <!-- BOTÓN DEVEXTREME FLOTANTE EN EL BORDE DERECHO -->
      <dx-button
        class="toggle-arbol-btn"
        [icon]="arbolVisible ? 'chevronleft' : 'chevronright'"
        [hint]="arbolVisible ? 'Ocultar panel' : 'Mostrar panel'"
        [width]="20"
        [height]="40"
        type="default"
        stylingMode="text"
        (onClick)="toggleArbol()">
      </dx-button>

    </div>

  </div>  

  <!-- ========== PANEL DERECHO ========== -->
  <div class="MAD001-contenido-panel">    
    
    <div class="row gx-3">
      <div class="col-12">
        <div class="card-content row">

          <dx-form
            #form
            [(formData)]="dataAppModel"
            [readOnly]="readOnly"
            [colCount]="2"
            labelLocation="top"
            [showColonAfterLabel]="false"            
          >
            <!-- Grupo Principal -->
            <dxi-item itemType="group" caption="Información General" [colSpan]="2" [colCount]="3">

              <!-- ID Aplicación -->
              <dxi-item
                dataField="ID_APLICACION"
                editorType="dxTextBox"
                [editorOptions]="{
                  maxLength: 30,
                  placeholder: 'Ingrese ID de aplicación',
                }"
              >
                <dxi-validation-rule
                  type="async"
                  message="Esta aplicación ya existe!"
                  [validationCallback]="ValideExistencia">
                </dxi-validation-rule>
                <dxi-validation-rule type="required" message="ID de aplicación es requerido"></dxi-validation-rule>
                <dxo-label text="ID Aplicación"></dxo-label>
              </dxi-item>

              <!-- ID Aplicación Padre -->
              <dxi-item
                dataField="ID_APLICACION_PADRE"
                editorType="dxSelectBox"
                [editorOptions]="{
                  items: idAppPadreItems,
                  placeholder: 'Seleccione tipo',
                  searchEnabled: true
                }"
              >
                <dxo-label text="ID Aplicación Padre"></dxo-label>
                <div *dxTemplate>
                  <dx-select-box
                    [dataSource]="idAppPadreItems"
                    [(value)]="dataAppModel.ID_APLICACION_PADRE"
                    [readOnly]="readOnly"
                    displayExpr="APLICACION"
                    valueExpr="ID_APLICACION"
                    [searchEnabled]="true"
                    placeholder="Seleccione ID Aplicación Padre"
                    (onValueChanged)="onValueChanged($event)"
                  >
                  </dx-select-box>
                </div>
              </dxi-item>

              <!-- Nombre -->
              <dxi-item
                dataField="NOMBRE"
                editorType="dxTextBox"
                [editorOptions]="{
                  maxLength: 60,
                  placeholder: 'Ingrese nombre de aplicación'
                }"
                [colSpan]="1"
              >
                <dxi-validation-rule type="required" message="Nombre es requerido"></dxi-validation-rule>
                <dxo-label text="Nombre"></dxo-label>
              </dxi-item>

              <!-- Tipo -->
              <dxi-item
                dataField="TIPO"
                editorType="dxSelectBox"
                [editorOptions]="{
                  items: tipoItems,
                  placeholder: 'Seleccione tipo',
                  searchEnabled: true
                }"
              >
                <dxi-validation-rule type="required" message="Tipo es requerido"></dxi-validation-rule>
                <dxo-label text="Tipo"></dxo-label>
              </dxi-item>    

              <!-- Acción -->
              <dxi-item
                dataField="ACCION"
                editorType="dxSelectBox"
                [editorOptions]="{
                  items: accionItems,
                  placeholder: 'Seleccione acción',
                  searchEnabled: true
                }"
              >
                <dxi-validation-rule type="required" message="Acción es requerida"></dxi-validation-rule>
                <dxo-label text="Acción"></dxo-label>
              </dxi-item>      

              <!-- Estado -->
              <dxi-item
                dataField="ESTADO"
                editorType="dxSelectBox"
                [editorOptions]="{
                  items: estadoItems,
                  placeholder: 'Seleccione estado',
                  searchEnabled: true
                }"
              >
                <dxo-label text="Estado"></dxo-label>
              </dxi-item>

              <!-- Nivel -->
              <dxi-item
                dataField="NIVEL"
                editorType="dxSelectBox"
                [editorOptions]="{
                  items: nivelItems,
                  placeholder: 'Seleccione nivel',
                  searchEnabled: true
                }"
              >
                <dxi-validation-rule
                  type="custom"
                  [reevaluate]="true"
                  message="Nivel es requerido cuando el tipo es KPI"
                  [validationCallback]="validarNivel.bind(this)">
                </dxi-validation-rule>
                <dxo-label text="Nivel"></dxo-label>
              </dxi-item>

            </dxi-item>
            

            <dxi-item itemType="group" caption="Métricas" [colSpan]="2" [colCount]="3">             

              <!-- Meta Inferior -->
              <dxi-item
                dataField="META_INFERIOR"
                editorType="dxNumberBox"
                [editorOptions]="{
                  placeholder: 'Ingrese meta inferior',
                  showSpinButtons: true,
                  format: '#,##0.00',
                  step: 0.01
                }"
              >
                <dxo-label text="Meta Inferior"></dxo-label>
              </dxi-item>

               <!-- Meta Superior -->
              <dxi-item
                dataField="META_SUPERIOR"
                editorType="dxNumberBox"
                [editorOptions]="{
                  placeholder: 'Ingrese meta superior',
                  showSpinButtons: false,
                  format: '#,##0.00',
                  step: 0.01
                }"
              >
                <dxo-label text="Meta Superior"></dxo-label>
              </dxi-item>

               <!-- Unidad de Medida -->
              <dxi-item
                dataField="UDM"
                editorType="dxSelectBox"
                [editorOptions]="{
                  items: udmItems,
                  displayExpr: 'NOMBRE',
                  valueExpr: 'ID_UDM',
                  placeholder: 'Seleccione unidad de medida',
                  searchEnabled: true
                }"
              >                
                <dxo-label text="Unidad Medida"></dxo-label>
              </dxi-item>              

            </dxi-item>          

            <!-- Grupo de Comentarios -->
            <dxi-item itemType="group" caption="Comentarios" [colSpan]="2">

              <!-- Comentarios -->
              <dxi-item
                dataField="COMENTARIOS"
                editorType="dxTextArea"
                [editorOptions]="{
                  height: 180,
                  placeholder: 'Ingrese comentarios'
                }"
                [colSpan]="2"
              >
                <dxo-label text=" "></dxo-label>
              </dxi-item>

            </dxi-item>

          </dx-form>

        </div>
      </div>
    </div>

    <app-vistarapida
      id="vistaMAD001"
      [aplicacion]="prmUsrAplBarReg.aplicacion"
    ></app-vistarapida>

    <app-geninformes [events]="eventsSubjectInformes.asObservable()">
    </app-geninformes>
    
  </div><!-- FIN panel contenido -->
  
</div><!-- FIN contenedor principal -->

<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [position]="{ of: 'r-container' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  message="Un momento. Procesando..."
  [hideOnOutsideClick]="false">
</dx-load-panel>
