<!-- data-source-parameters.component.html -->
<div class="data-source-parameters">
  
  <!-- Mostrar mensaje cuando no hay origen -->
  <div *ngIf="!origin" class="empty-state">
    <p>Seleccione un origen de datos para configurar los parámetros</p>
  </div>

  <!-- Mostrar mensaje cuando el origen no tiene campos definidos -->
  <div *ngIf="origin && fields.length === 0" class="empty-state">
    <p>No hay parámetros configurados para el origen: {{ origin }}</p>
  </div>

  <!-- Usar dx-form -->
  <dx-form
    *ngIf="origin && fields.length > 0"
    [(formData)]="formData"
    [readOnly]="readonly"
    [colCount]="colCount"
    labelLocation="top"
    [showColonAfterLabel]="false"
    (onFieldDataChanged)="onFieldDataChanged($event)">
    
    <!-- Generar dxi-item para cada campo -->
    <dxi-item
      *ngFor="let field of fields"
      [dataField]="field.name"
      [editorType]="getEditorType(field)"
      [editorOptions]="getEditorOptions(field)"
      [colSpan]="1">
      
      <dxo-label [text]="field.label"></dxo-label>
      
      <dxi-validation-rule
        *ngIf="field.required"
        type="required"
        [message]="getRequiredMessage(field)">
      </dxi-validation-rule>
      
    </dxi-item>

    <dxi-item
       *ngIf="showTestConnectionButton()"
       [colSpan]="colCount">
       <div style="display:flex; justify-content:flex-end; width:100%;">
         <dx-button
           text="Probar"
           type="default"
           [disabled]="testingConnection"
           (onClick)="testConnection()">
         </dx-button>
       </div>
    </dxi-item>

  </dx-form>

</div>
