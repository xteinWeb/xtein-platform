<div style="display: flex; width: 100%; height: 91%; flex-direction: column;">
  <div
    style="display: flex; width: 100%; height: 22%; justify-content: space-between; flex-direction: column; gap:35px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px;">
      <div style="width: 50%;">
        <span>Lista de Precio</span>
        <dx-drop-down-box #dropListasPrecio id="dropListasPrecio" width="100%" displayExpr="DESCRI" valueExpr="ID_LISTA"
          columnResizingMode="widget" placeholder="Selecciones Lista de Precio" [readOnly]="false"
          [showClearButton]="true" [dataSource]="DListasPrecio" [(value)]="selectLista" [(opened)]="openedPopup"
          [dropDownOptions]="{
            width: 520,
            height: 350,
            hideOnParentScroll: true,
            container: '#containerPopupList'
          }"
        >
          <div id="containerGridProd1" *dxTemplate="let data of 'content'">
            <dx-data-grid #GridProd1 height="100%" width="100%" keyExpr="ID_LISTA" columnResizingMode="widget"
              [columnAutoWidth]="true" [focusedRowEnabled]="true" [hoverStateEnabled]="true"
              [allowColumnResizing]="true" [rowAlternationEnabled]="true" [selection]="{ mode: 'single' }"
              [dataSource]="DListasPrecio" [(selectedRowKeys)]="selectLista"
              (onSelectionChanged)="onSelectionLista($event)">
              <dxo-scrolling mode="virtual"></dxo-scrolling>
              <dxo-search-panel [visible]="true" [width]="450"></dxo-search-panel>
              <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>

              <dxi-column dataField="ID_LISTA" caption="Cod. Lista" cssClass="clsEncabHis" [width]="110"></dxi-column>
              <dxi-column dataField="DESCRIPCION" caption="Nombre" cssClass="clsEncabHis" [width]="190"></dxi-column>
              <dxi-column dataField="TIPO" caption="Tipo" cssClass="clsEncabHis"></dxi-column>
            </dx-data-grid>
          </div>
        </dx-drop-down-box>
      </div>
      <div style="width: 50%;">
        <div class="content-list-titles"
          style="display: grid; grid-template-columns: 25% 25% 25% 25%; text-align: center;">
          <span class="detalle"><b>Tipo</b></span>
          <span class="detalle"><b>Base de Precio</b></span>
          <span class="detalle"><b>Fecha de Inicio</b></span>
          <span class="detalle"><b>Fecha Final</b></span>
        </div>
        <div style="width: 100%; height: 78%">
          <dx-list #listPrecio id="listPrecio" width="100%" height="93%" keyExpr="PRODUCTO" selectionMode="none"
            [searchEnabled]="false" [dataSource]="DListaSelect">
            <div *dxTemplate="let data of 'item'" class="content-list">
              <div style="width: 25%; display: grid; place-content: center; gap: 10px">
                <div style="text-align: center;">{{ data.TIPO }}</div>
              </div>
              <div style="width: 25%; display: grid; place-content: center; gap: 10px">
                <div style="text-align: center;">{{ data.BASE_PRECIO }}</div>
              </div>
              <div style="width: 25%; display: grid; place-content: center; gap: 10px">
                <div style="text-align: center;">{{ data.FECHA_INICIO }}</div>
              </div>
              <div style="width: 25%; display: grid; place-content: center; gap: 10px">
                <div style="text-align: center;">{{ data.FECHA_FINAL }}</div>
              </div>
            </div>
          </dx-list>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px;">
      <div style="width: 50%;">
        <span>Matrices con Base Costo Tipo Listas de Precio</span>
        <dx-drop-down-box #dropMatrices id="dropMatrices" width="100%" displayExpr="PRODUCTO" valueExpr="PRODUCTO"
          columnResizingMode="widget" placeholder="Selecciones Matrices" [readOnly]="false"
          [showClearButton]="true" [dataSource]="DataSourceMatrices" [(value)]="selectMatrices" [(opened)]="openedPopupMatrices"
          [dropDownOptions]="{
            width: 520,
            height: 350,
            hideOnParentScroll: true,
            container: '#containerPopupList'
          }"
          (onValueChanged)="onValueChangedMatrices($event)"
        >
          <div id="containerGridProd2" *dxTemplate="let data of 'content'">
            <dx-data-grid #GridProd1 height="88%" width="100%" keyExpr="PRODUCTO" columnResizingMode="widget"
              [columnAutoWidth]="true" [focusedRowEnabled]="true" [hoverStateEnabled]="true"
              [allowColumnResizing]="true" [rowAlternationEnabled]="true" [selection]="{ mode: 'multiple' }"
              [dataSource]="DataSourceMatrices" [(selectedRowKeys)]="selectMatrices"
            >
              <dxo-scrolling mode="virtual"></dxo-scrolling>
              <dxo-search-panel [visible]="true" [width]="450"></dxo-search-panel>
              <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>

              <dxi-column dataField="PRODUCTO" caption="Cod. Lista" cssClass="clsEncabHis" [width]="110"></dxi-column>
              <dxi-column dataField="NOMBRE" caption="Nombre" cssClass="clsEncabHis" [width]="190"></dxi-column>
            </dx-data-grid>
            <div style="display: flex; justify-content: center; width: 100%; padding: 5px;" >
              <dx-button id="btnAceptarPT" stylingMode="contained" text="Aceptar" type="default" [width]="100"
                (onClick)="aceptarBottom($event, 'Aceptar')"></dx-button>
              <dx-button id="btnCancelarPT" stylingMode="contained" text="Cancelar" type="normal" [width]="110"
                [style.margin-left]="'20px'" (onClick)="aceptarBottom($event, 'Cancelar')"></dx-button>
            </div>
          </div>
        </dx-drop-down-box>
      </div>
    </div>
  </div>
</div>
