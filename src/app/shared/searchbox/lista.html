<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla con selección y resaltado</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
    .fila-seleccionada {
      background-color: #cce5ff;
    }
    .fila-checkbox {
      transform: scale(1.5); /* Aumenta tamaño del checkbox */
      cursor: pointer;
    }  </style>
</head>
<body>

<h3>Tabla con selección múltiple y resaltado</h3>

<table id="miTabla">
  <thead>
    <tr>
      <th>Seleccionar</th>
      <th>ID</th>
      <th>Nombre</th>
      <th>Edad</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><input type="checkbox" class="fila-checkbox"></td>
      <td>1</td>
      <td>Juan</td>
      <td>30</td>
    </tr>
    <tr>
      <td><input type="checkbox" class="fila-checkbox"></td>
      <td>2</td>
      <td>Ana</td>
      <td>25</td>
    </tr>
    <tr>
      <td><input type="checkbox" class="fila-checkbox"></td>
      <td>3</td>
      <td>Carlos</td>
      <td>35</td>
    </tr>
  </tbody>
</table>

<br>
<button onclick="obtenerSeleccionados()">Obtener seleccionados</button>

<script>
  // Detectar cambios en los checkboxes para resaltar la fila
  document.querySelectorAll(".fila-checkbox").forEach(checkbox => {
    checkbox.addEventListener("change", () => {
      const fila = checkbox.closest("tr");
      if (checkbox.checked) {
        fila.classList.add("fila-seleccionada");
      } else {
        fila.classList.remove("fila-seleccionada");
      }
    });
  });

  // Función para obtener filas seleccionadas
  function obtenerSeleccionados() {
    const checkboxes = document.querySelectorAll(".fila-checkbox");
    const seleccionados = [];

    checkboxes.forEach((checkbox, index) => {
      if (checkbox.checked) {
        const fila = checkbox.closest("tr");
        const datosFila = {
          id: fila.cells[1].textContent,
          nombre: fila.cells[2].textContent,
          edad: fila.cells[3].textContent
        };
        seleccionados.push(datosFila);
      }
    });

    console.log("Filas seleccionadas:", seleccionados);
    alert("Seleccionados:\n" + JSON.stringify(seleccionados, null, 2));
  }
</script>

</body>
</html>
