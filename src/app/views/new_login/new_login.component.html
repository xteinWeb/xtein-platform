<div class="bg-login bx-shadow overflow-hidden">
  <div class="container px-5 py-5 px-md-0 text-start my-5">
    <div class="row gx-lg-5 align-items-center" style="height:calc(100vh - 200px);">
      <div class="d-none d-md-block col-md-7 col-xl-8 mb-lg-0 xxl-fontsize" style="z-index: 10">
        <h1 class="my-3 display-5 fw-bold ls-tight" style="color: rgba(255,255,255,1);">
          Bienvenido
        </h1>
        <p class="mb-4 opacity-70" style="color: rgba(255,255,255,1);">
          Aquí inicia tu camino al exito...
        </p>
      </div>
      <div class="col-12 col-md-5 col-xl-4 mb-lg-0 position-relative text-center">
        <div id="card_face" class="face card card-rotating bg-glass h-100"
          style="width: 350px; height: 470px !important; max-width: 100% !important;">
          <div class="face face-front">
            <div class="card-up loading-logo mt-5">
              <img src="assets/img/logo/xtein.svg" width="50%" alt="Logo" />
            </div>

            <div class="card-body px-4 py-5 px-md-5 text-center align-middle">
              <label class="mb-2" style="font-size:1.25rem; font-weight:300;">Iniciar Sesión</label>
              <br>

                <form class="from-login row" method="post">
                  <div class="mb-2">
                    <label class="visually-hidden" for="FormGroupData">Usuario</label>
                    <div class="input-group input-icon-inside">
                      <div class="input-group-text"><i class="icon-usuario"></i></div>
                      <input id="userName" name="userName" type="text" class="form-control"
                        placeholder="Usuario/Nombre de usuario" autocomplete="off" required
                        [formControl]="username" [(ngModel)]="loginForm.USUARIO"
                        (focusout)="focusOutFunction($event)" />
                      </div>
                    </div>

                    <div class="form-outline mb-2">
                      <div class="input-group input-icon-inside">
                        <div class="input-group-text"><i class="icon-secure-sl"></i></div>
                        <input id="password" name="password" type="password" class="form-control"
                          placeholder="Contraseña" required autocomplete="current-password"
                          autocomplete="off" [(ngModel)]="loginForm.PASSWORD" />
                        </div>
                      </div>

                      <div class="mb-2">
                        <div class="input-group input-icon-inside">
                          <div class="input-group-text"><i class="icon-building-sl"></i></div>
                          <select id="empresa" name="empresa" class="form-control ellipsis" required
                            [(ngModel)]="loginForm.EMPRESA">
                            <option value="" disabled selected hidden> <span> Seleccione Empresa...
                            </span> </option>
                            @for (empresa of empresas; track empresa) {
                              <option [value]="empresa.ID_UN"> {{
                              empresa.NOMBRE }} </option>
                            }
                          </select>
                        </div>
                      </div>

                      <div class="justify-content-center">
                        <button type="submit" class="btn btn-primary btn-block col-12 mb-2"
                          (click)="login(loginForm)">
                          Iniciar
                        </button>
                        <button class="btn-link col-12 text-muted"
                          (click)="onChangePassword($event, 'contrasena')">
                          ¿Has olvidado tu contraseña?
                        </button>
                      </div>
                    </form>
                  </div>
                </div>

                <div class="face face-back">
                  <div class="card-up loading-logo mt-5">
                    <img src="assets/img/logo/xtein.svg" width="50%" alt="Logo" />
                  </div>

                  <div class="from-padre card-body text-center align-middle"
                    style="display: flex; justify-content: flex-start; width: 1050px; padding: 0px;">
                    <div id="input-user" class="px-4 py-5 px-md-5" style="width: 50%;">
                      <label class="mb-2" style="font-size:1.25rem; font-weight:500;">Has olvidado tu
                      contraseña</label>
                      <br>
                        <label>
                          Ingrese su usuario y enviaremos un <strong>c&oacute;digo</strong>
                          de restablecimiento a su <strong>correo ó número de contacto</strong>.
                        </label>
                        <br>

                          <form class="from-login row">
                            <!-- 2 column grid layout with text inputs for the first and last names -->
                            <div class="my-2">
                              <label class="visually-hidden"
                              for="inlineFormInputGroupUsername">Usuario</label>
                              <div class="input-group input-icon-inside">
                                <div class="input-group-text"><i class="icon-usuario"></i></div>
                                <input id="newUserName" type="text" class="form-control"
                                  placeholder="Username" autocomplete="off" required
                                  [formControl]="username" [(ngModel)]="loginForm.USUARIO" />
                                </div>
                              </div>

                              <div class="justify-content-center">
                                <!-- Submit button -->
                                <button type="submit" class="btn btn-primary btn-block col-12 mb-1"
                                  (click)="onChangePassword($event, 'enviar')">
                                  Enviar
                                </button>
                                <button class="btn btn-muted col-12"
                                  (click)="onChangePassword($event, 'salir')">
                                  Cancelar
                                </button>
                              </div>
                            </form>
                          </div>

                          <div id="input-codigo" class="px-4 py-5 px-md-5" style="width: 50%;">
                            <label class="mb-2" style="font-size:1.25rem; font-weight:500;">Ingrese su
                            c&oacute;digo</label>
                            <br>
                              <label style="line-height: 1.25;">
                                Por favor ingrese el <strong>c&oacute;digo</strong> de 6 d&iacute;gitos que
                                env&iacute;amos a su <strong>Correo de contacto</strong> registrado.
                                <small class="xt-text-sm-l-muted">
                                  <p>
                                    Si no lo encuentra su <strong>c&oacute;digo</strong> comun&iacute;quese con
                                    el <strong>equipo de soporte</strong> para conocer los pasos a seguir.
                                  </p>
                                </small>
                              </label>

                              <form>
                                <div class="mb-3 d-flex justify-content-center validation-code">
                                  <input type="text" inputmode="numeric" class="form-control me-2 text-center" id="digito1"
                                    name="digito1" maxlength="1" [(ngModel)]="digitos[0]"
                                    (input)="onDigitInput(0)" (keydown)="onKeyDown($event, 0)" (paste)="onPaste($event, 0)" required>
                                    <input type="text" inputmode="numeric" class="form-control me-2 text-center" id="digito2"
                                      name="digito2" maxlength="1" [(ngModel)]="digitos[1]"
                                      (input)="onDigitInput(1)" (keydown)="onKeyDown($event, 1)" (paste)="onPaste($event, 1)" required>
                                      <input type="text" inputmode="numeric" class="form-control me-2 text-center" id="digito3"
                                        name="digito3" maxlength="1" [(ngModel)]="digitos[2]"
                                        (input)="onDigitInput(2)" (keydown)="onKeyDown($event, 2)" (paste)="onPaste($event, 2)" required>
                                        <input type="text" inputmode="numeric" class="form-control me-2 text-center" id="digito4"
                                          name="digito4" maxlength="1" [(ngModel)]="digitos[3]"
                                          (input)="onDigitInput(3)" (keydown)="onKeyDown($event, 3)" (paste)="onPaste($event, 3)" required>
                                          <input type="text" inputmode="numeric" class="form-control me-2 text-center" id="digito5"
                                            name="digito5" maxlength="1" [(ngModel)]="digitos[4]"
                                            (input)="onDigitInput(4)" (keydown)="onKeyDown($event, 4)" (paste)="onPaste($event, 4)" required>
                                            <input type="text" inputmode="numeric" class="form-control text-center" id="digito6"
                                              name="digito6" maxlength="1" [(ngModel)]="digitos[5]"
                                              (input)="onDigitInput(5)" (keydown)="onKeyDown($event, 5)" (paste)="onPaste($event, 5)" required>
                                            </div>
                                            <button type="submit" class="btn btn-primary btn-block col-12 mb-1"
                                              [disabled]="!isComplete()"
                                            (click)="onChangePassword($event, 'aceptar')">Validar</button>
                                            <button class="btn btn-muted col-12"
                                            (click)="onChangePassword($event, 'salir')">Cancelar</button>
                                          </form>
                                        </div>

                                        <div id="input-password" class="px-4 py-5 px-md-5" style="width: 50%;">
                                          <label class="mb-2" style="font-size:1.25rem; font-weight:300;">Generar
                                          Contraseña</label>
                                          <br>

                                            <form class="from-login row" method="post">
                                              <div class="form-outline mb-2">
                                                <div class="input-group input-icon-inside">
                                                  <div class="input-group-text"><i class="icon-secure-sl"></i></div>
                                                  <input id="newpassword" type="password" class="form-control"
                                                    placeholder="Nueva Contraseña" required autocomplete="current-password"
                                                    autocomplete="off" [(ngModel)]="passwordForm.NEW_PASSWORD"
                                                    (focusout)="valuechangedPassword($event, 'NEW_PASSWORD')" />
                                                  </div>
                                                </div>

                                                <div class="form-outline mb-2">
                                                  <div class="input-group input-icon-inside">
                                                    <div class="input-group-text"><i class="icon-secure-sl"></i></div>
                                                    <input id="confpassword" type="password" class="form-control"
                                                      placeholder="Confirmar Contraseña" required
                                                      autocomplete="current-password" autocomplete="off"
                                                      [(ngModel)]="passwordForm.CONFIRM_PASSWORD"
                                                      (focusout)="valuechangedPassword($event, 'CONFIRM_PASSWORD')" />
                                                    </div>
                                                  </div>

                                                  <!-- Requisitos de contraseña -->
                                                  <div class="mb-3 text-start">
                                                    <small class="text-muted">
                                                      <strong>La contraseña debe cumplir:</strong>
                                                      <ul class="mb-0 mt-1" style="font-size: 0.75rem; line-height: 1.2;">
                                                        <li>Mínimo 8 caracteres</li>
                                                        <li>Al menos una letra mayúscula (A-Z)</li>
                                                        <li>Al menos una letra minúscula (a-z)</li>
                                                        <li>Al menos un número (0-9)</li>
                                                        <li>Al menos un carácter especial (!&#64;#$%^&*-_=+)</li>
                                                      </ul>
                                                    </small>
                                                  </div>


                                                  <div class="justify-content-center">
                                                    <button type="submit" class="btn btn-primary btn-block col-12 mb-2"
                                                      (click)="cambiarPassword(passwordForm)">
                                                      Guardar
                                                    </button>
                                                  </div>
                                                </form>
                                              </div>
                                            </div>
                                          </div>

                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
